id: jfrog-artifactory-detect
info:
  name: JFrog Artifactory Container Registry Detection
  author: method-security
  severity: info
  description: Detects JFrog Artifactory installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: CONTAINER_REGISTRY
    method-module-name: JFROG_ARTIFACTORY
    cpe: cpe:2.3:a:jfrog:artifactory:*:*:*:*:*:*:*:*
  tags: discovery,jfrog,artifactory,artifact-repository,container-registry
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login/"
      - "{{BaseURL}}/ui/favicon.ico"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(body, "<title>JFrog")'
          - '("-595620639" == mmh3(base64_py(body)))'
        condition: or
