id: vmware-esxi-detect

info:
  name: VMware ESXi Detect
  author: method-security
  severity: info
  classification:
    cpe: cpe:2.3:o:vmware:esxi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: vmware
    product: esxi
    shodan-query:
      - product:"VMware ESXi"
      - "VMware ESXi"
      - html:"ID_EESX_Welcome"
      - html:"ID_EESX"
    category: hypervisor
    method-application-type: HYPERVISOR
    method-module-name: VMWARE_ESXI
  tags:
    - tech
    - vmware
    - esxi
    - hypervisor
    - virtualization

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/"
      - "{{BaseURL}}/folder"
      - "{{BaseURL}}/mob/"
      - "{{BaseURL}}/folder?dcPath=ha-datacenter"
    redirects: true
    max-redirects: 3
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "VMware ESXi"
          - "ID_EESX_Welcome"
          - "ID_EESX"
          - "ID_ESX_VIClientDesc"
          - "ID_DownloadHClientWin"
          - "ID_OpenEHC"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "VMware ESXi"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)VMware\s+ESXi\s+is\s+virtual\s+infrastructure\s+software'
          - '(?i)ID_ESX_VIClientDesc'
          - '(?i)ID_VIRCLI'
          - '(?i)VMware\s+ESXi\s+provides\s+a\s+highly\s+scalable'