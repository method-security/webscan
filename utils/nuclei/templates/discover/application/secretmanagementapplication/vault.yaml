id: vault-detect
info:
  name: HashiCorp Vault Detection
  author: method-security
  severity: info
  description: Detects HashiCorp Vault using the Vault cluster response header from the unauthenticated sys/health API.
  metadata:
    method-application-type: SECRET_MANAGEMENT_APPLICATION
    method-module-name: VAULT
    cpe: cpe:2.3:a:hashicorp:vault:*:*:*:*:*:*:*:*
  tags: discovery,vault,hashicorp,secrets,secret-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/v1/sys/health"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "x-vault-cluster"
        case-insensitive: true
