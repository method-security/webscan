id: neo4j-browser-detect
info:
  name: Neo4j Browser Detection
  author: method-security
  severity: info
  description: Detects Neo4j Browser database administration UI using Neo4j Browser-specific titles and static assets.
  metadata:
    method-application-type: DATABASE_MANAGEMENT_APPLICATION
    method-module-name: NEO4J_BROWSER
    cpe: cpe:2.3:a:neo4j:neo4j:*:*:*:*:*:*:*:*
  tags: discovery,database,admin,neo4j,browser
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/browser/"
      - "{{BaseURL}}/browser"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>neo4j browser"
          - "assets/images/device-icons"
          - "<div id=\"mount\""
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "neo4j browser"
          - "favicons/safari-pinned-tab.svg"
          - "<div id=\"mount\""
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "neo4j-browser"
          - "<div id=\"mount\""
        condition: and
        case-insensitive: true
