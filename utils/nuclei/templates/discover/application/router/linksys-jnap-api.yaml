id: linksys-jnap-api-detect
info:
  name: Linksys JNAP API Detection
  author: method-security
  severity: info
  description: Detects Linksys JNAP REST API device-info responses that expose model, firmware, and hardware metadata.
  metadata:
    method-application-type: ROUTER
    method-module-name: LINKSYS
    cpe: cpe:2.3:o:linksys:router_firmware:*:*:*:*:*:*:*:*
  tags: discovery,linksys,smart-wifi,wrt,e-series,router,network-management,soho,api
http:
  - method: POST
    path:
      - "{{BaseURL}}/JNAP/"
    headers:
      Content-Type: "application/json"
      X-JNAP-Action: "http://linksys.com/jnap/core/GetDeviceInfo"
    body: '{}'
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"result"'
          - '"output"'
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "firmwareVersion"
          - "modelNumber"
        case-insensitive: true
    extractors:
      - type: regex
        name: firmware_version
        part: body
        group: 1
        regex:
          - '"firmwareVersion"\s*:\s*"([^"]+)"'
      - type: regex
        name: model
        part: body
        group: 1
        regex:
          - '"modelNumber"\s*:\s*"([^"]+)"'
      - type: regex
        name: hardware_version
        part: body
        group: 1
        regex:
          - '"hardwareVersion"\s*:\s*"([^"]+)"'
