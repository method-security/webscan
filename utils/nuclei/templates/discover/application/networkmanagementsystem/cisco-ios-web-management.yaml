id: cisco-ios-web-management-detect
info:
  name: Cisco IOS Web Management Detection
  author: method-security
  severity: info
  description: Detects Cisco IOS device web management interfaces using IOS-specific management titles and legacy administrative path markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_IOS
    cpe: cpe:2.3:o:cisco:ios:*:*:*:*:*:*:*:*
  tags: discovery,cisco,ios,web-management,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/exec/show/log/CR"
      - "{{BaseURL}}/level/15/exec/-"
      - "{{BaseURL}}/cgi-bin/webcm"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*Cisco\s+IOS\s+(Management|Configuration|Administration).*Interface.*</title>'
          - '(?i)Cisco\s+IOS\s+(Configuration|Management|Web\s+Interface)'
          - '(?i)Cisco\s+(Router|Switch)\s+IOS\s+(Management|Configuration)\s+Interface'
      - type: word
        part: body
        words:
          - "Cisco IOS Software"
          - "/exec/show/"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "Cisco IOS Software"
          - "/level/15/"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "Cisco IOS Software"
          - "cgi-bin/webcm"
        condition: and
        case-insensitive: true
