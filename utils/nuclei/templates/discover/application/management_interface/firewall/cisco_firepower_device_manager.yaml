id: cisco-firepower-device-manager-detect
info:
  name: Cisco Firepower Device Manager (FDM) Detection
  author: method-security
  severity: info
  description: Detects Cisco Firepower Device Manager (FDM) web interfaces by identifying unique titles, API paths, and Cisco-specific assets related to FDM login and management portals.
  metadata:
    method-application-type: MANAGEMENT_INTERFACE_FIREWALL
    method-module-name: CISCO_FIREPOWER_DEVICE_MANAGER
  tags: discovery,cisco,firepower,fdm,device-manager,firewall
requests:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/login"
      - "{{BaseURL}}/ui/"
      - "{{BaseURL}}/api/fdm/v1/auth/generatetoken"
      - "{{BaseURL}}/login"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*(Firepower|FDM).*Device Manager.*</title>'
          - '(?i)/api/fdm/v[0-9]+/'
          - '(?i)firepower.*device.*manager'
          - '(?i)fdm.*(api|interface|login)'
      - type: word
        part: body
        words:
          - "Firepower Device Manager"
          - "Cisco Firepower"
          - "fdm-login"
          - "/ui/login"
          - "generatetoken"
          - "firepower_logo"
        case-insensitive: true