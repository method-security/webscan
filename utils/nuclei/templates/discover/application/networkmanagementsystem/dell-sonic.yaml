id: dell-sonic-detect
info:
  name: Dell Enterprise SONiC Detection
  author: method-security
  severity: info
  description: Detects Dell Enterprise SONiC (Software for Open Networking in the Cloud) network operating system REST API and management interfaces
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: DELL_SONIC
  tags: discovery,dell,sonic,switch,network-os,restconf,rest-api
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/.well-known/host-meta"
      - "{{BaseURL}}/restconf"
      - "{{BaseURL}}/restconf/yang-library-version"
      - "{{BaseURL}}/restconf/data/ietf-yang-library:modules-state"
      - "{{BaseURL}}/restconf/data/ietf-restconf-monitoring:restconf-state/capabilities"
      - "{{BaseURL}}/ui"
      - "{{BaseURL}}/login"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*SONiC.*</title>'
          - '(?i)Enterprise\s+SONiC'
          - '(?i)Dell.*SONiC'
          - '(?i)sonic-mgmt-framework'
      - type: word
        part: body
        words:
          - "SONiC"
          - "sonic-mgmt-framework"
          - "Enterprise SONiC"
          - "Dell SONiC"
          - "restconf/data"
          - "ietf-yang-library"
          - "ietf-restconf-monitoring"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "SONiC"
          - "sonic-mgmt"
        case-insensitive: true
      - type: regex
        part: header
        regex:
          - '(?i)sonic'
          - '(?i)restconf'
