imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # File JSON Schema
  SaasFingerprintProfile:
    properties:
      headers: optional<map<string, optional<list<string>>>>
      body: optional<list<string>>
      pageNotFound: optional<list<string>>
  SaasFingerprintEntry:
    properties:
      fingerprintProfile: SaasFingerprintProfile
      domainSlugs: optional<list<string>>
  SaasFingerprintFile:
    properties:
      fingerprints: map<string, SaasFingerprintEntry>
  # CLI Config
  DiscoverSaasConfig:
    properties:
      orgs: list<string>
      saasCompanies: optional<list<string>>
      ssoCompanies: optional<list<string>>
      maxRedirects: integer
      ignoreCrossDomainRedirects: boolean
      verifyTls: boolean
      timeout: integer
      sleep: integer
      jitter: integer
      threads: integer
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
      userAgent: method.UserAgentPreset
  # Report
  SaasActiveFinding:
    properties:
      ssoPage: optional<string>
      companyPage: optional<boolean>
  SaasActiveRequest:
    properties:
      request: http.HttpRequestResponse
      screenshot: optional<base64>
      findings: optional<SaasActiveFinding>
  SaasActiveCompany:
    properties:
      company: string
      requests: optional<list<SaasActiveRequest>>
  SaasActiveAttempt:
    properties:
      org: string
      companies: list<SaasActiveCompany>
  DiscoverSaasResult:
    properties:
      orgs: optional<list<SaasActiveAttempt>>
  DiscoverSaasReport:
    properties:
      config: DiscoverSaasConfig
      result: DiscoverSaasResult
      errors: optional<list<string>>
