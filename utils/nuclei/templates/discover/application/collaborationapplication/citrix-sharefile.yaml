id: citrix-sharefile-detect
info:
  name: Citrix ShareFile Detection
  author: method-security
  severity: info
  description: Detects Citrix ShareFile collaboration and file sharing portals using ShareFile-specific login pages and Citrix branding.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: CITRIX_SHAREFILE
    cpe: cpe:2.3:a:citrix:sharefile:*:*:*:*:*:*:*:*
  tags: discovery,citrix,sharefile,collaboration,file-sharing
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Authentication/Login"
      - "{{BaseURL}}/oauth/authorize"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "welcome! enter your details to sign in to sharefile")'
          - 'contains(tolower(body), "sharefile") && contains(tolower(body), "remember me") && contains(tolower(body), "privacy policy")'
          - 'contains(tolower(all), "sharefile") && contains(tolower(all), "auth.sharefile.io")'
        condition: or
      - type: word
        part: all
        words:
          - "x-storefront-instanceid"
          - "receiver for web"
          - "citrix workspace"
          - "logonpoint/receiver"
          - "ctxs."
          - "storeweb"
        condition: or
        negative: true
        case-insensitive: true
