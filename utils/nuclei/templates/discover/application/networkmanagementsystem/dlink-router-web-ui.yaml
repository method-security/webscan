id: dlink-router-web-ui-detect
info:
  name: D-Link Router Web Management Detection
  author: method-security
  severity: info
  description: Detects D-Link consumer SOHO router web management interfaces (DIR series, COVR mesh) using D-Link model-specific titles, login form markers, and cookie names.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: DLINK
    method-sub-module-name: DIR_SERIES
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:h:dlink:*:*:*:*:*:*:*:*:*
  tags: discovery,soho,dlink,dir,covr,router,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.htm"
      - "{{BaseURL}}/Main_Login.asp"
      - "{{BaseURL}}/login.asp"
      - "{{BaseURL}}/index.asp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "d-link") && contains(tolower(body), "login") && (contains(tolower(body), "dir-") || contains(tolower(body), "dsl-") || contains(tolower(body), "dap-"))'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "d-link systems") && contains(tolower(body), "login") && contains(tolower(body), "password")'
          - 'status_code == 200 && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "main_login.asp") && contains(tolower(body), "d-link")'
          - 'status_code == 200 && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && (contains(tolower(body), "<title>d-link corporation") || contains(tolower(body), "<title>d-link wireless")) && contains(tolower(body), "login")'
          - 'status_code == 200 && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && (contains(tolower(body), "<title>d-link dsl-") || contains(tolower(body), "<title>d-link router management system") || contains(tolower(body), "<title>d-link : unified services router") || contains(tolower(body), "<title>d-link voip wireless router"))'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "covr") && contains(tolower(body), "d-link") && contains(tolower(body), "login")'
    extractors:
      - type: regex
        name: firmware_version
        part: body
        group: 1
        regex:
          - '(?i)firmware[^<]{0,40}?([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:B[0-9]+)?)'
          - '(?i)fw_version[^=]*=\s*[''"]([^''"]+)[''"]'
          - '(?i)"firmwareVersion"\s*:\s*"([^"]+)"'
