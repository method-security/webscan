id: dlink-router-web-ui-detect
info:
  name: D-Link Router Management Console Detection
  author: method-security
  severity: info
  description: |
    Detects D-Link router web management interfaces using D-Link model titles and login form markers.
    Requires D-Link as a standalone brand token so unrelated HTML classes such as `cd-link-block` do not
    combine with a reflected `/Main_Login.asp` path and create a false positive.
  metadata:
    method-application-type: ROUTER
    method-module-name: DLINK_ROUTER
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:h:dlink:*:*:*:*:*:*:*:*:*
  tags: discovery,dlink,router,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.htm"
      - "{{BaseURL}}/Main_Login.asp"
      - "{{BaseURL}}/login.asp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # A raw substring match for "d-link" also matches unrelated tokens such
      # as "cd-link-block". Keep the brand token bounded before evaluating
      # the model/login variants below.
      - type: regex
        part: body
        regex:
          - '(?i)(?:^|[^a-z0-9])d-link(?:[^a-z0-9]|$)'
      - type: dsl
        dsl:
          - 'contains(tolower(body), "d-link") && contains(tolower(body), "login") && (contains(tolower(body), "dir-") || contains(tolower(body), "dsl-") || contains(tolower(body), "dap-"))'
          - 'contains(tolower(body), "d-link systems") && contains(tolower(body), "login") && contains(tolower(body), "password")'
          - 'contains(tolower(body), "main_login.asp") && contains(tolower(body), "d-link")'
          - 'contains(tolower(body), "<title>d-link corporation") && contains(tolower(body), "wireless router") && contains(tolower(body), "login")'
          - '(contains(tolower(body), "<title>d-link dsl-") || contains(tolower(body), "<title>d-link router management system") || contains(tolower(body), "<title>d-link : unified services router") || contains(tolower(body), "<title>d-link voip wireless router"))'
