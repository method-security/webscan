id: prometheus-detect
info:
  name: Prometheus Detection
  author: method-security
  severity: info
  description: Detects Prometheus servers by validating health, build info, and graph/query UI endpoints.
  metadata:
    method-application-type: OBSERVABILITY_PLATFORM
    method-module-name: PROMETHEUS
    cpe: cpe:2.3:a:prometheus:prometheus:*:*:*:*:*:*:*:*
  tags: discovery,prometheus,observability,monitoring,observability-platform
http:
  - method: GET
    path:
      - "{{BaseURL}}/-/healthy"
      - "{{BaseURL}}/api/v1/status/buildinfo"
      - "{{BaseURL}}/graph"
      - "{{BaseURL}}/query"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Prometheus Server is Healthy."
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(header), "application/json") && regex("\"status\"\\s*:\\s*\"success\"", body) && regex("\"data\"\\s*:\\s*\\{[^}]*\"version\"\\s*:\\s*\"[0-9]+(?:\\.[0-9]+){1,3}(?:[-+][^\"]+)?\"", body) && regex("\"revision\"\\s*:\\s*\"[0-9a-f]{7,40}\"", body)'
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(header), "text/html") && regex("(?i)<title>Prometheus Time Series Collection and Processing Server</title>", body) && contains(tolower(body), "prometheus") && contains(tolower(body), "static")'
