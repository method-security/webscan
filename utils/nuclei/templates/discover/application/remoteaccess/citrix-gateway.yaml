id: citrix-gateway-detect
info:
  name: Citrix Gateway Detection
  author: method-security
  severity: info
  description: Detects Citrix Gateway (NetScaler Gateway) installations by analyzing
    response headers, body content, and common paths
  reference: https://www.citrix.com/products/citrix-gateway/
  metadata:
    method-application-type: REMOTE_ACCESS
    method-module-name: CITRIX_GATEWAY
  tags: tech,citrix,gateway,netscaler,remote-access
http:
- method: GET
  path:
  - '{{BaseURL}}'
  - '{{BaseURL}}/vpn/index.html'
  - '{{BaseURL}}/citrix/xenapp/'
  - '{{BaseURL}}/Citrix/XenDesktop/'
  - '{{BaseURL}}/vpns/'
  - '{{BaseURL}}/logon/LogonPoint/index.html'
  stop-at-first-match: true
  matchers-condition: or
  matchers:
  - type: word
    part: header
    words:
    - 'server: netscaler'
    case-insensitive: true
  - type: word
    part: body
    words:
    - citrix gateway
    - netscaler gateway
    case-insensitive: true
  - type: regex
    part: body
    regex:
    - (?i)citrix.*?gateway.*?[0-9]+\.[0-9]+\.[0-9]+
    - (?i)netscaler.*?[0-9]+\.[0-9]+\.[0-9]+
    - (?i)logonpoint.*?index\.html
    - (?i)vpns/portal.*?scripts
    - (?i)NSGateway.*?[0-9]+\.[0-9]+
    - (?i)ctxs_.*?[a-zA-Z0-9]{8,}
