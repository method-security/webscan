id: sonicwall-sma-detect
info:
  name: SonicWall SMA / SSL-VPN Portal Detection
  author: method-security
  severity: info
  description: Detects SonicWall Secure Mobile Access and SSL-VPN portals by matching SonicWall-branded Virtual Office and SMA login assets.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: SONICWALL_SMA
    method-sub-module-name: SSL_VPN_PORTAL
    method-detection-state: DETECTED
    cpe: cpe:2.3:a:sonicwall:secure_mobile_access:*:*:*:*:*:*:*:*
  tags: discovery,vpn,sonicwall,sma,ssl-vpn,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cgi-bin/welcome"
      - "{{BaseURL}}/spog/welcome"
      - "{{BaseURL}}/__api__/v1/logon"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "SonicWall"
          - "Virtual Office"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "SonicWall"
          - "Secure Mobile Access"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "SonicWall"
          - "SMA"
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - "swap="
          - "SWSessionID="
        case-insensitive: true
      - type: word
        part: body
        words:
          - "<title>SonicWall</title>"
          - "<title>SonicWALL</title>"
          - "<title>SonicWall Virtual Office</title>"
        case-insensitive: true
