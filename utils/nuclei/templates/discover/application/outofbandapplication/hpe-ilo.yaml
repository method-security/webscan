id: hpe-ilo-detect
info:
  name: HPE iLO Detection
  author: method-security
  severity: info
  description: Detects HPE Integrated Lights-Out out-of-band management interfaces using iLO login pages, headers, and Redfish/OEM markers.
  metadata:
    method-application-type: OUT_OF_BAND_APPLICATION
    method-module-name: HPE_ILO
    cpe: cpe:2.3:a:hpe:integrated_lights-out:*:*:*:*:*:*:*:*
  tags: discovery,hpe,hp,ilo,bmc,redfish,out-of-band,remote-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/html/login.html"
      - "{{BaseURL}}/redfish/v1/"
      - "{{BaseURL}}/json/login_session"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "integrated lights-out"
          - "hewlett packard"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "integrated lights-out"
          - "hewlett-packard"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "integrated lights-out"
          - "hpe"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "hpe ilo"
          - "hp ilo"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "\"Oem\""
          - "\"Hpe\""
          - "\"RedfishVersion\""
        condition: and
      - type: word
        part: body
        words:
          - "platform=\":ilo:\""
          - "hewlett-packard"
        condition: and
        case-insensitive: true
      - type: word
        part: header
        words:
          - "hp-ilo"
          - "hpe-ilo"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*(?:HPE|HP|Hewlett[ -]Packard)\s+iLO\b.*</title>'
          - '(?i)<title[^>]*>.*\biLO\b.*(?:HPE|HP|Hewlett[ -]Packard).*</title>'
