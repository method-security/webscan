id: huawei-gpon-ont-nonce-detect
info:
  name: Huawei GPON ONT Nonce Endpoint Detection
  author: method-security
  severity: info
  description: Detects Huawei GPON ONT pre-auth nonce responses from the GetRandCount endpoint.
  metadata:
    method-application-type: ROUTER
    method-module-name: HUAWEI_GPON_ONT
    cpe: cpe:2.3:o:huawei:home_gateway_firmware:*:*:*:*:*:*:*:*
  tags: discovery,huawei,gpon,ont,hg8245,echolife,iot,isp-cpe,soho,status-info
http:
  - method: GET
    path:
      - "{{BaseURL}}/asp/GetRandCount.asp"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'len(body) > 0 && len(body) < 4096'
      - type: dsl
        dsl:
          - >-
            contains(body, "RandKey") ||
            contains(body, "RandCount") ||
            contains(body, "RandNum") ||
            regex("^\\s*[0-9]+\\s*$", body)
