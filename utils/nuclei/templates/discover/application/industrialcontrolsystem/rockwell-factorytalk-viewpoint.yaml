id: rockwell-factorytalk-viewpoint-detect
info:
  name: Rockwell FactoryTalk ViewPoint Detection
  author: method-security
  severity: info
  description: Detects Rockwell Automation FactoryTalk ViewPoint web interfaces.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: ROCKWELL_FACTORYTALK_VIEWPOINT
    cpe: cpe:2.3:a:rockwellautomation:factorytalk_viewpoint:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,rockwell,factorytalk,viewpoint
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/FTViewPoint/"
      - "{{BaseURL}}/ViewPoint/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "factorytalk viewpoint") && (contains(tolower(body), "rockwell automation") || contains(tolower(body), "/ftviewpoint/") || contains(tolower(body), "login") || contains(tolower(body), "<title>factorytalk viewpoint"))'
          - 'contains(tolower(body), "rockwell automation") && contains(tolower(body), "factorytalk") && contains(tolower(body), "viewpoint")'
          - 'contains(tolower(body), "/ftviewpoint/") && contains(tolower(body), "factorytalk")'
