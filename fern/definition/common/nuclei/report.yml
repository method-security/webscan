imports:
  config: ./config.yml
  http: ../../common/http.yml
  probe: ./probe.yml
types:
  CweDetails:
    properties:
      id: string
  CveDetails:
    properties:
      id: string
      cvssMetrics: optional<string>
      cvssScore: optional<float>
      epssScore: optional<float>
      epssPercentile: optional<float>
      cpe: optional<string>
  ClassificationDetails:
    properties:
      cwes: optional<list<CweDetails>>
      cves: optional<list<CveDetails>>
  NucleiFindingInfo:
    properties:
      name: optional<string>
      softwareWeakness: optional<string> # Name to use to create Software Weakness Objects
      description: optional<string>
      impact: optional<string>
      remediation: optional<string>
      reference: optional<list<string>>
      classification: optional<ClassificationDetails>
      severity: optional<string>
      finding: boolean
      probe: optional<probe.NucleiProbe>
      metadata: optional<map<string, string>>
      # Per-host runtime values captured by template extractors
      # (SEC-702.A). Keyed by extractor `name:` (e.g. `device_mac`,
      # `device_serial`, `architecture_value`); the value is the
      # comma-joined ExtractedResults from Nuclei. Populated by the
      # Builder when an event carries `ExtractorName`. Engines that
      # also read template metadata (e.g. discover/application) treat
      # extractedFields as the override channel — extractor output
      # wins over `metadata` when both keys are present.
      extractedFields: optional<map<string, string>>
  NucleiAttemptInfo:
    properties:
      templateId: string # Nuclei template ID
      httpRequestResponse: http.HttpRequestResponse
      finding: optional<NucleiFindingInfo>
  NucleiTargetInfo:
    properties:
      target: string
      baselineAttempt: optional<NucleiAttemptInfo>
      attempts: optional<list<NucleiAttemptInfo>>
