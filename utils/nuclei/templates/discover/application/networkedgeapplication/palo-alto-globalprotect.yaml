id: palo-alto-globalprotect-detect
info:
  name: Palo Alto GlobalProtect Portal Detection
  author: method-security
  severity: info
  description: Detects Palo Alto Networks GlobalProtect VPN portals by matching GlobalProtect-specific ESP login pages and PAN-OS assets.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: PALO_ALTO_GLOBALPROTECT
    method-sub-module-name: SSL_VPN_PORTAL
    method-detection-state: DETECTED
    cpe: cpe:2.3:a:paloaltonetworks:globalprotect:*:*:*:*:*:*:*:*
  tags: discovery,vpn,palo-alto,globalprotect,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/global-protect/login.esp"
      - "{{BaseURL}}/ssl-vpn/login.esp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "GlobalProtect"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "Palo Alto Networks"
          - "globalprotect"
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - "GP_PREF="
        case-insensitive: true
      - type: word
        part: body
        words:
          - "<title>GlobalProtect</title>"
          - "<title>GlobalProtect Portal</title>"
          - "<title>Palo Alto Networks</title>"
        case-insensitive: true
