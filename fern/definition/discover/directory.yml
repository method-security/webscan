imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # Wordlist Enums
  WordlistType:
    enum:
      - DIRECTORIES
      - FILES
  WordlistSize:
    enum:
      - TINY
      - SMALL
      - MEDIUM
      - LARGE
  # Common Objects
  DirectoryFrontier:
    properties:
      basePath: string
      depth: integer
      discoveredFrom: optional<string>
  # Config Struct
  DiscoverDirectoryConfig:
    properties:
      targets: list<string>
      paths: optional<list<string>>
      wordlistType: optional<WordlistType>
      wordlistSize: optional<WordlistSize>
      extensions: optional<list<string>>
      recursionDepth: optional<integer>
      recursionStatusCodes: optional<string>
      httpMethods: list<http.HttpMethod>
      responseCodes: string
      enableCommonResponseFilters: boolean
      verifyTls: boolean
      threshold: float
      timeout: integer
      globalRateLimit: integer
      ignoreCrossDomainRedirects: boolean
      maxRedirectsBaselineRequest: integer
      globalTimeout: integer
      retries: integer
      sleep: integer
      jitter: integer
      threads: integer
      userAgent: method.UserAgentPreset
  # Report Structs
  DirectoryTargetInfo:
    properties:
      target: string
      baselineAttempts: list<http.HttpRequestResponse>
      attempts: list<http.HttpRequestResponse>
      frontiers: optional<list<DirectoryFrontier>>
  DiscoverDirectoryResult:
    properties:
      targets: optional<list<DirectoryTargetInfo>>
  DiscoverDirectoryReport:
    properties:
      config: DiscoverDirectoryConfig
      result: DiscoverDirectoryResult
      errors: optional<list<string>>
