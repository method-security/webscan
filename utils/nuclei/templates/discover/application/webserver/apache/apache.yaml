id: apache-detect
info:
  name: Apache Web Server Detection
  author: method-security
  severity: info
  description: Detects web servers running Apache HTTPD by analyzing response headers and common response patterns
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: APACHE
    cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  tags: discovery,apache,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: all
        regex:
          - "(?i)server:\\s*apache"
          - "(?i)server:\\s*Apache/[\\d.]+"
          - "(?i)via:\\s*apache"
          - "(?i)x-powered-by:\\s*apache"
          - "(?i)Apache Server at"
          - "(?i)Apache/[\\d.]+ \\(Unix\\)"
          - "(?i)<address>Apache/[\\d.]+"
      - type: word
        part: header
        words:
          - "tomcat"
          - "coyote" 
          - "catalina"
        case-insensitive: true
        negative: true
      - type: word
        part: body
        words:
          - "Apache Tomcat"
          - "Apache-Tomcat"
          - "Apache Coyote"
          - "Apache-Coyote"
          - "Powered by Tomcat"
          - "Tomcat Web Application Manager"
          - "Tomcat Web Server"
          - "Tomcat Catalina"
          - "Tomcat Coyote"
        case-insensitive: true
        negative: true