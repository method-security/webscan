imports:
  routes: ./routes.yml
  common: ./common.yml
types:
  VulnType:
    enum:
    - IDOR
    - PATH_TRAVERSAL
    - RCE
    - SQLI
    - XSS
    - CORS_HEADER_INJECTION
    - ESCAPE_HEADERS_INJECTION
    - HTTP_HEADERS_INJECTION
    - SENSITIVE_EXPOSED_HEADER_INJECTION
    - SERVER_OVERLOAD_HEADER_INJECTION
  RequestParams:
    properties:
      pathParams: string
      queryParams: string
      headerParams: string
      bodyParams: string
      formParams: string
      multipartParams: string
  ParsedRequestParams:
    properties:
      pathParams: map<string, string>
      queryParams: map<string, string>
      headerParams: map<string, string>
      bodyParams: string
      formParams: map<string, string>
      multipartParams: map<string, string>
  RequestReport:
    properties:
      baseUrl: string
      path: string
      method: common.HttpMethod
      pathParams: optional<map<string, string>>
      queryParams: optional<map<string, string>>
      headerParams: optional<map<string, string>>
      bodyParams: optional<string>
      formParams: optional<map<string, string>>  
      multipartParams: optional<map<string, string>>
      vulnTypes: optional<list<VulnType>>
      statusCode: optional<integer>
      responseBody: optional<string>
      responseHeaders: optional<map<string, string>>
      errors: optional<list<string>>
  MultipleRequestReport:
    properties:
      requests: list<RequestReport>
      errors: optional<list<string>>