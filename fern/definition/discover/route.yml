imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # Function Config Struct
  DiscoverRouteConfig:
    properties:
      target: string
      collectStaticAssets: boolean
      ignoreCrossDomainRoutes: boolean
      ignoreCrossDomainStaticAssets: boolean
      spiderDepth: integer
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      sleep: integer
      jitter: integer
      threads: integer
      userAgent: method.UserAgentPreset
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
      bundleUrls: optional<list<string>>
      fetchSourceMaps: boolean
      maxBundles: integer
      headers: optional<map<string, string>>
      cookies: optional<map<string, string>>
      localStorage: optional<map<string, string>>
      sessionStorage: optional<map<string, string>>
  # Report Struct
  RouteBodyParam:
    properties:
      name: string
      exampleValues: optional<list<string>>
  RouteQueryParam:
    properties:
      name: string
      exampleValues: optional<list<string>>
  RoutePathParam:
    properties:
      name: string
      exampleValues: optional<list<string>>
  RouteDetails:
    properties:
      baseURL: string
      path: string
      method: http.HttpMethod
      queryParams: optional<list<RouteQueryParam>>
      bodyParams: optional<list<RouteBodyParam>>
      pathParams: optional<list<RoutePathParam>>
      evidence: optional<string>
      pathTemplate: optional<string>
  StaticAssetDetails:
    properties:
      local: optional<list<string>>
      remote: optional<list<string>>
  WebApplicationDetails:
    properties:
      baseURL: string
      routes: optional<list<RouteDetails>>
      staticAssets: optional<StaticAssetDetails>
  DiscoverRouteResult:
    properties:
      target: string
      webApplications: optional<list<WebApplicationDetails>>
  DiscoverRouteReport:
    properties:
      config: DiscoverRouteConfig
      result: DiscoverRouteResult
      errors: optional<list<string>>
