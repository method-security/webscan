id: aveva-wonderware-scada-web-detect
info:
  name: AVEVA / Wonderware InTouch Access Anywhere / Plant SCADA Detection
  author: method-security
  severity: info
  description: Detects AVEVA and Wonderware web-access SCADA products including InTouch Access Anywhere, Plant SCADA, System Platform, and AVEVA Edge.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: AVEVA_WONDERWARE_SCADA_WEB
    cpe: cpe:2.3:a:aveva:intouch_access_anywhere:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,aveva,wonderware,intouch,plant-scada,system-platform
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/AccessAnywhere/"
      - "{{BaseURL}}/AccessAnywhere/start.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "intouch access anywhere") && (contains(tolower(body), "wonderware") || contains(tolower(body), "aveva")) && (contains(tolower(body), "accessanywhere") || contains(tolower(body), "start.html") || contains(tolower(body), "login") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "aveva plant scada") && (contains(tolower(body), "login") || contains(tolower(body), "runtime") || contains(tolower(body), "<title>aveva plant scada"))'
          - 'contains(tolower(body), "aveva edge") && contains(tolower(body), "scada") && (contains(tolower(body), "login") || contains(tolower(body), "runtime") || contains(tolower(body), "<title>aveva edge"))'
          - 'contains(tolower(body), "wonderware") && contains(tolower(body), "system platform") && contains(tolower(body), "web") && (contains(tolower(body), "login") || contains(tolower(body), "intouch") || contains(tolower(body), "accessanywhere"))'
          - 'contains(tolower(body), "accessanywhere") && contains(tolower(body), "intouch") && (contains(tolower(body), "wonderware") || contains(tolower(body), "aveva"))'
