imports:
  config: config.yml
types:
  # Http Method Enum
  HttpMethod:
    enum:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
      - HEAD
      - CONNECT
      - TRACE
  # Struct for the request parameters of a request
  RequestParams:
    properties:
      pathParams: optional<map<string, string>>
      queryParams: optional<map<string, string>>
      headerParams: optional<map<string, string>>
      bodyParams: optional<string>
      formParams: optional<map<string, string>>
      multipartParams: optional<map<string, string>>
  # Internal Request Config (Used as a parameter for the SendRequest function)
  RequestConfig:
    properties:
      baseURL: string
      path: string
      method: HttpMethod
      requestParams: RequestParams
      followRedirects: boolean
      maxRedirects: optional<integer>
      insecure: boolean
      timeout: integer
      requestMethod: config.RequestMethod
      headlessConfig: optional<config.HeadlessConfig>
      browserbaseConfig: optional<config.BrowserbaseConfig>
      browserbaseSecrets: optional<config.BrowserbaseSecrets>
  # Request Struct
  RequestInfo:
    properties:
      baseUrl: string
      path: string
      method: HttpMethod
      pathParams: optional<map<string, string>>
      queryParams: optional<map<string, string>>
      headerParams: optional<map<string, string>>
      bodyParams: optional<string>
      formParams: optional<map<string, string>>  
      multipartParams: optional<map<string, string>>
      redirectChain: optional<list<string>>
      statusCode: optional<integer>
      responseBody: optional<string>
      responseHeaders: optional<map<string, string>>
      errors: optional<list<string>>
      timestamp: datetime