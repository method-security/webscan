id: raisecom-cpe-detect
info:
  name: Raisecom Technology CPE (ZXV / ADSL2+ Series) Web Management Detection
  author: method-security
  severity: info
  description: |
    Detects Raisecom Technology DSL CPE (ZXV-818-P and related ADSL2+ products) running the Realtek SDK stock webserver.
    Probes the Realtek SDK Referer-header origin-check bypass on /status.htm with Referer: http://<host>/login.htm.
    Fires ONLY when the response carries Raisecom-distinctive content — specifically a MAC address with the Raisecom
    OUI prefix 00:1A:EF in the device-info table. Generic Realtek SDK responses without a Raisecom OUI are caught by
    the realtek-sdk-cpe-detect template (module name REALTEK_SDK) instead, so we don't mis-label other OEMs on the
    same stack as Raisecom.
    Validated against TC-015 (185.99.214.43 — ZXV-818-P/Vr.1.21, Apr 6 2021 build, OUI 00:1A:EF Raisecom).
    Note: the Referer-bypass is a Realtek-SDK-broad implementation flaw — the template still implements it
    even though the live target may have rotated since TC-015's original capture. Devices that patched the bypass
    won't expose Raisecom-distinctive data here and will only surface via realtek-sdk-cpe-detect.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: RAISECOM
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:raisecom:cpe_firmware:*:*:*:*:*:*:*:*
  tags: discovery,raisecom,zxv,adsl,dsl,realtek-sdk,cpe,network-edge,soho
http:
  # Realtek SDK Referer-header bypass on /status.htm. With
  # Referer: http://{{Hostname}}/login.htm the embedded webserver
  # serves the device-info table pre-auth. Required signals:
  #   - 200 status
  #   - Server: RTK Web 0.9 (Realtek SDK stock webserver)
  #   - DSL Router Status title + Firmware Version + MAC Address
  #     fields (the device-info layout)
  #   - MAC Address with the Raisecom OUI prefix 00:1A:EF
  # The OUI check is what makes this template Raisecom-distinctive
  # — without it we'd mis-label generic Realtek SDK OEMs (Zhone /
  # Comtrend / white-label Chinese DSL modems) as Raisecom whenever
  # the device-info table is exposed. Devices that patched the
  # Referer bypass don't surface here and instead match the broader
  # realtek-sdk-cpe-detect (module REALTEK_SDK) template.
  - method: GET
    path:
      - "{{BaseURL}}/status.htm"
    headers:
      Referer: "http://{{Hostname}}/login.htm"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: header
        regex:
          - '(?i)server:\s*RTK Web 0\.9'
      - type: word
        part: body
        words:
          - "<title>DSL Router Status</title>"
      - type: word
        part: body
        words:
          - "Firmware Version"
          - "MAC Address"
        condition: and
      # Raisecom-distinctive signal: MAC Address in the device-info
      # table carries the Raisecom OUI prefix 00:1A:EF. This is what
      # separates Raisecom from other OEMs on the same Realtek SDK
      # stack — without this match we fall through to the generic
      # realtek-sdk-cpe-detect template.
      - type: regex
        part: body
        regex:
          - '(?i)<th>MAC Address</th>\s*<td>\s*00:1A:EF(?::[0-9A-F]{2}){3}\s*</td>'
    extractors:
      # Firmware version: Raisecom format is <Model>/Vr.<X.YY>, e.g.
      # ZXV-818-P/Vr.1.21. Captures the full string so both model
      # and version are visible downstream.
      - type: regex
        name: firmware_version
        part: body
        group: 1
        regex:
          - '<th>Firmware Version</th>\s*<td>\s*([A-Z0-9-]+/Vr\.[0-9.]+)\s*</td>'
      # Built date (free-form C ctime-like string).
      - type: regex
        name: built_date
        part: body
        group: 1
        regex:
          - '<th>Built Date</th>\s*<td>\s*([A-Za-z]+\s+\d+\s+\d{4}\s+\d{2}:\d{2}:\d{2})\s*</td>'
      # Serial number (MAC-form, 12-hex). Surfaced via the extractor
      # field; dedicated ApplicationFingerprintAttempt.deviceSerial
      # wiring lands with SEC-702.A / PR #423 in a follow-on PR.
      - type: regex
        name: device_serial
        part: body
        group: 1
        regex:
          - '<th>Serial Number</th>\s*<td>\s*([0-9A-F]{12})\s*</td>'
      # MAC address (canonical colon form). Surfaced via the extractor
      # field; dedicated ApplicationFingerprintAttempt.deviceMac wiring
      # + OUI lookup (00:1A:EF → Raisecom) lands with SEC-702.A / PR
      # #423 in a follow-on PR.
      - type: regex
        name: device_mac
        part: body
        group: 1
        regex:
          - '<th>MAC Address</th>\s*<td>\s*([0-9A-F]{2}(?::[0-9A-F]{2}){5})\s*</td>'
      # Operational status — confirms DSL CPE product family.
      - type: regex
        name: operational_status
        part: body
        group: 1
        regex:
          - '<th[^>]*>Operational Status</th>\s*<td>\s*(ADSL2?\+?\s+[A-Za-z0-9]+)'
