id: ubiquiti-unifi-network-detect
info:
  name: Ubiquiti UniFi Network Application Detection
  author: method-security
  severity: info
  description: Detects Ubiquiti UniFi Network controller/admin consoles using UniFi-specific UI and API markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: UBIQUITI_UNIFI_NETWORK
    cpe: cpe:2.3:a:ui:unifi_network_application:*:*:*:*:*:*:*:*
  tags: discovery,ubiquiti,unifi,network-controller,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/manage/account/login"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/api/self"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "unifi network application") && contains(tolower(body), "ubiquiti")'
          - 'contains(tolower(body), "unifi.ui.com") && contains(tolower(body), "network") && contains(tolower(body), "redirecting")'
          - 'contains(tolower(body), "/manage/account/login") && contains(tolower(body), "unifi") && contains(tolower(body), "ubiquiti")'
