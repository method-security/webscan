types:
  # User Agent Preset Enum
  UserAgentPreset:
    enum:
      - RANDOM
      - CHROME
      - FIREFOX
      - SAFARI
      - EDGE
      - CURL
  # Request Method Enum
  RequestMethod:
    enum:
      - STANDARD
      - HEADLESS
      - BROWSERBASE
  # Request Method Config Structs
  HeadlessRequestConfig:
    properties:
      pathToBrowserShell: optional<string>
      minDOMStabalizeTime: integer
      browser: optional<unknown>
  BrowserbaseRequestConfig:
    properties:
      proxy: optional<boolean>
      countries: optional<list<string>>
  BrowserbaseRequestSecrets:
    properties:
      token: string
      project: string
