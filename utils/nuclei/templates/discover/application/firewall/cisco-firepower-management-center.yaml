id: cisco-firepower-management-center-detect
info:
  name: Cisco Firepower Management Center (FMC) Detection
  author: method-security
  severity: info
  description: Detects Cisco Firepower Management Center (FMC) web interfaces by identifying unique titles, login paths, and Cisco-specific assets associated with FMC portals.
  metadata:
    method-application-type: FIREWALL
    method-module-name: CISCO_FIREPOWER_MANAGEMENT_CENTER
    cpe: cpe:2.3:a:cisco:firepower_management_center:*:*:*:*:*:*:*:*
  tags: discovery,cisco,firepower,fmc,management-center,firewall
requests:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/ui/login"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Cisco Firepower Management Center"
          - "Cisco FMC Login"
          - "Cisco Firepower System"
        case-insensitive: true
