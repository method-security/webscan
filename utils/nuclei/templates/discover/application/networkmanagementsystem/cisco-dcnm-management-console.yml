id: cisco-dcnm-detect
info:
  name: Cisco DCNM Management Console Detection
  author: method-security
  severity: info
  description: Detects Cisco Data Center Network Manager (DCNM) management console pages by matching unique DCNM UI endpoints and assets.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_DCNM
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:a:cisco:data_center_network_manager:*:*:*:*:*:*:*:*
  tags: discovery,cisco,dcnm,network-management-system
http:
  - method: GET
    path:
      - "{{BaseURL}}/dcnm/login"
      - "{{BaseURL}}/dcnm/home"
      - "{{BaseURL}}/dcnm/"
      - "{{BaseURL}}/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)/dcnm/app/ui/'
          - '(?i)/dcnm/app/ui/js/'
          - '(?i)/dcnm/app/ui/css/'
      - type: word
        part: body
        words:
          - "Cisco DCNM"
          - "Cisco Data Center Network Manager"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)dcnm-logo'
          - '(?i)cisco-logo.*dcnm'
