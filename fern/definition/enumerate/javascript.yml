imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # ENUMs
  JavascriptArtifactKind:
    enum:
      - PAGE
      - ENTRY
      - CHUNK
      - SOURCE_MAP
  # Common Objects
  JavascriptArtifact:
    properties:
      url: string
      kind: JavascriptArtifactKind
      sizeBytes: integer
      statusCode: optional<integer>
      contentType: optional<string>
      discoveredFrom: optional<string>
      referenceCount: optional<integer>
  JavascriptEndpoint:
    properties:
      path: string
      method: optional<http.HttpMethod>
      queryParams: optional<list<string>>
      bodyParams: optional<list<string>>
      contentType: optional<string>
      callExpression: optional<string>
      sourceUrl: string
  JavascriptSecret:
    properties:
      kind: string
      name: optional<string>
      value: optional<string>
      attributes: optional<map<string, string>>
      context: optional<map<string, string>>
      sourceUrl: string
  # Config Struct
  EnumerateJavascriptConfig:
    properties:
      targets: list<string>
      followChunks: boolean
      fetchSourceMaps: boolean
      maxArtifacts: integer
      analysisWindowBytes: integer
      analysisWindowOverlapBytes: integer
      ignoreCrossDomainEndpoints: boolean
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      sleep: integer
      jitter: integer
      threads: integer
      userAgent: method.UserAgentPreset
      headers: optional<map<string, string>>
      cookies: optional<map<string, string>>
  # Result Struct
  JavascriptBundleDetails:
    properties:
      local: optional<list<JavascriptArtifact>>
      remote: optional<list<JavascriptArtifact>>
  JavascriptApplicationDetails:
    properties:
      baseUrl: string
      pages: optional<list<JavascriptArtifact>>
      bundles: optional<JavascriptBundleDetails>
      baseUrlCandidates: optional<list<string>>
      endpoints: optional<list<JavascriptEndpoint>>
      secrets: optional<list<JavascriptSecret>>
  EnumerateJavascriptResult:
    properties:
      targets: list<string>
      webApplications: optional<list<JavascriptApplicationDetails>>
      unrootedEndpoints: optional<list<JavascriptEndpoint>>
  # Report Struct
  EnumerateJavascriptReport:
    properties:
      config: EnumerateJavascriptConfig
      result: EnumerateJavascriptResult
      errors: optional<list<string>>
