id: citrix-sharefile-detect
info:
  name: Citrix ShareFile Detection
  author: method-security
  severity: info
  description: Detects Citrix ShareFile collaboration and file sharing portals using ShareFile-specific login pages and Citrix branding.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: CITRIX_SHAREFILE
    cpe: cpe:2.3:a:citrix:sharefile:*:*:*:*:*:*:*:*
  tags: discovery,citrix,sharefile,collaboration,file-sharing
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Authentication/Login"
      - "{{BaseURL}}/oauth/authorize"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "sharefile"
          - "citrix"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "sf-login"
          - "sharefile"
        condition: and
        case-insensitive: true
      - type: word
        part: all
        words:
          - "sf-api"
          - "sharefile"
        condition: and
        case-insensitive: true
