id: vault-detect
info:
  name: HashiCorp Vault Detection
  author: method-security
  severity: info
  description: Detects HashiCorp Vault using the unauthenticated sys/health API and Vault-specific health response fields.
  metadata:
    method-application-type: SECRET_MANAGEMENT_APPLICATION
    method-module-name: VAULT
    cpe: cpe:2.3:a:hashicorp:vault:*:*:*:*:*:*:*:*
  tags: discovery,vault,hashicorp,secrets,secret-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/v1/sys/health"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 429
          - 472
          - 473
          - 501
          - 503
      - type: dsl
        dsl:
          - 'contains(tolower(body), "\"initialized\"") && contains(tolower(body), "\"sealed\"") && (contains(tolower(body), "\"standby\"") || contains(tolower(body), "\"server_time_utc\"") || contains(tolower(body), "\"version\"") || contains(tolower(header), "x-vault-cluster"))'
