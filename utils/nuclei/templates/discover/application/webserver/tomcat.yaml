id: tomcat-detect
info:
  name: Apache Tomcat Server Detection
  author: method-security
  severity: info
  description: Detects Apache Tomcat Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEBSERVER
    method-module-name: TOMCAT
  tags: discovery,tomcat,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/manager/"
      - "{{BaseURL}}/manager/html"
      - "{{BaseURL}}/host-manager/"
      - "{{BaseURL}}/docs/"
      - "{{BaseURL}}/examples/"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/favicon.ico"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: apache tomcat"
          - "server: apache-coyote"
          - "server: tomcat"
          - "x-powered-by: tomcat"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)apache\\s+tomcat\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)tomcat\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)tomcat\\s+web\\s+server"
          - "(?i)catalina\\s*[0-9]+\\.[0-9]+"
          - "(?i)coyote\\s*[0-9]+\\.[0-9]+"
          - "(?i)powered\\s+by\\s+tomcat"