id: mongo-express-detect
info:
  name: Mongo Express Detection
  author: method-security
  severity: info
  description: Detects mongo-express web database administration interfaces using mongo-express-specific titles and routes.
  metadata:
    method-application-type: DATABASE_MANAGEMENT_APPLICATION
    method-module-name: MONGO_EXPRESS
    cpe: cpe:2.3:a:mongo-express:mongo-express:*:*:*:*:*:*:*:*
  tags: discovery,database,admin,mongodb,mongo-express
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/db/admin/"
      - "{{BaseURL}}/status"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "mongo express") && contains(tolower(body), "database")'
          - 'contains(tolower(body), "<title>mongo express") && contains(tolower(body), "/db/")'
          - 'contains(tolower(body), "powered by mongo-express")'
