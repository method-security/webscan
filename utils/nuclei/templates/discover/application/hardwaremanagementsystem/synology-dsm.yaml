id: synology-dsm-detect
info:
  name: Synology DSM (DiskStation Manager) NAS Web Management Detection
  author: method-security
  severity: info
  description: |
    Detects Synology DSM (DiskStation Manager) NAS web management interfaces.
    Identification is anchored by the /webman/info.cgi unauthenticated k=v
    device disclosure on most DSM 5.x / 6.x / 7.x firmwares.
    Extractors capture model (model=DS920+), DSM firmware version
    (dsm_version=7.2.1-69057), and the chip-family token embedded in the
    synology_<chip_family>_<sku> "unique" string (synology_apollolake_ds920plus).
    The chip-family → architecture mapping is out of scope for this PR and
    lands with the SEC-702.A schema + engine work (tool-factory/sec-702 / #423).
    Catalog reference: SEC-702 — Cluster G (NAS).
  metadata:
    method-application-type: HARDWARE_MANAGEMENT_SYSTEM
    method-module-name: SYNOLOGY_DSM
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:synology:diskstation_manager:*:*:*:*:*:*:*:*
  tags: discovery,synology,dsm,nas,storage,hardware,management-console,soho
http:
  - method: GET
    path:
      - "{{BaseURL}}/webman/info.cgi"
    redirects: false
    matchers-condition: and
    matchers:
      # info.cgi returns k=v plaintext on most DSM firmware. The "model="
      # key alone is too generic (many products do); the DSM signature is
      # the co-occurrence of "model=" + "dsm_version=" + the synology_-
      # prefixed "unique=" token.
      - type: word
        part: body
        words:
          - "model="
          - "dsm_version="
          - "unique=synology_"
        condition: and
        case-insensitive: false
      - type: status
        status:
          - 200
    extractors:
      # model=DS920+ → subModule. Capture up to newline; Synology emits
      # model names with + / - punctuation (DS920+, DS220j, RS3621xs+).
      - type: regex
        name: model
        part: body
        group: 1
        regex:
          - '(?m)^model=([^\r\n]+)'
      # dsm_version=7.2.1-69057 → DSM firmware identifier.
      - type: regex
        name: dsm_version
        part: body
        group: 1
        regex:
          - '(?m)^dsm_version=([0-9A-Za-z._\-]+)'
      # unique=synology_<chip_family>_<sku> — extract just the
      # chip_family token (apollolake, geminilake, alpine, comcerto,
      # rtd1296, ...). Captured as named informational metadata; the
      # downstream chip-family → architecture mapping is out of scope
      # for this PR (see description above).
      - type: regex
        name: chip_family
        part: body
        group: 1
        regex:
          - '(?m)^unique=synology_([^_\r\n]+)_'
