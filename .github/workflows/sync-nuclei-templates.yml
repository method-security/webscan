name: Sync Nuclei CVE Templates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      year:
        description: 'CVE year to sync (e.g., 2025, 2026)'
        required: false
        default: '2025'
        type: string

env:
  DEFAULT_YEAR: '2025'  # Update this when a new year starts

jobs:
  sync-templates:
    name: Sync Nuclei CVE Templates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set year variable
        id: set_year
        run: |
          YEAR="${{ inputs.year || env.DEFAULT_YEAR }}"
          echo "year=${YEAR}" >> $GITHUB_OUTPUT
          echo "Syncing CVE templates for year: ${YEAR}"

      - name: Checkout webscan repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone nuclei-templates repository
        run: |
          git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git /tmp/nuclei-templates

      - name: Sync CVE templates
        id: sync_templates
        run: |
          YEAR="${{ steps.set_year.outputs.year }}"
          TARGET_DIR="utils/nuclei/templates/pentest/scan/cve/${YEAR}"
          SOURCE_DIR="/tmp/nuclei-templates/http/cves/${YEAR}"

          # Check if source directory exists
          if [ ! -d "${SOURCE_DIR}" ]; then
            echo "Warning: Source directory ${SOURCE_DIR} does not exist in nuclei-templates repo"
            exit 0
          fi

          # Create target directory if it doesn't exist
          mkdir -p "${TARGET_DIR}"

          # Remove existing templates in the target directory
          rm -rf ${TARGET_DIR}/*

          # Copy new templates from nuclei-templates repo
          cp -r ${SOURCE_DIR}/* ${TARGET_DIR}/

          # Count the number of templates synced
          TEMPLATE_COUNT=$(find ${TARGET_DIR} -type f -name "*.yaml" | wc -l)
          echo "Synced ${TEMPLATE_COUNT} CVE ${YEAR} templates"
          echo "template_count=${TEMPLATE_COUNT}" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check_changes
        run: |
          YEAR="${{ steps.set_year.outputs.year }}"
          git diff --quiet utils/nuclei/templates/pentest/scan/cve/${YEAR}/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update Nuclei CVE ${{ steps.set_year.outputs.year }} templates

            Synced CVE ${{ steps.set_year.outputs.year }} templates from projectdiscovery/nuclei-templates
            Total templates: ${{ steps.sync_templates.outputs.template_count }}
          branch: automated/sync-nuclei-cve-${{ steps.set_year.outputs.year }}-templates
          delete-branch: true
          title: 'Update Nuclei CVE ${{ steps.set_year.outputs.year }} Templates'
          body: |
            ## Nuclei CVE ${{ steps.set_year.outputs.year }} Template Sync

            This PR automatically syncs the latest CVE ${{ steps.set_year.outputs.year }} templates from the [projectdiscovery/nuclei-templates](https://github.com/projectdiscovery/nuclei-templates) repository.

            ### Changes
            - **Total templates synced:** ${{ steps.sync_templates.outputs.template_count }}
            - **Source:** https://github.com/projectdiscovery/nuclei-templates/tree/main/http/cves/${{ steps.set_year.outputs.year }}
            - **Target:** `utils/nuclei/templates/pentest/scan/cve/${{ steps.set_year.outputs.year }}/`

            ### Review Checklist
            - [ ] Review new CVE templates for relevance
            - [ ] Verify template syntax is valid
            - [ ] Ensure no sensitive data in templates

            ---
            *This PR was automatically generated by the [sync-nuclei-templates](.github/workflows/sync-nuclei-templates.yml) workflow*
          labels: |
            automated
            nuclei-templates
            dependencies
          assignees: seanhacker
