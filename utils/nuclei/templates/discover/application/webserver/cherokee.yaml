id: cherokee-detect
info:
  name: Cherokee Web Server Detection
  author: method-security
  severity: info
  description: Detects Cherokee Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: CHEROKEE
    cpe: cpe:2.3:a:cherokee-project:cherokee:*:*:*:*:*:*:*:*
  tags: discovery,cherokee,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/admin/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: cherokee"
          - "x-powered-by: cherokee"
          - "x-served-by: cherokee"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)cherokee\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)cherokee\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)cherokee\\s+server\\s+[0-9]+\\.[0-9]+"
          - "(?i)powered\\s+by\\s+cherokee"
          - "(?i)cherokee\\s+admin"
          - "(?i)cherokee\\s+configuration"