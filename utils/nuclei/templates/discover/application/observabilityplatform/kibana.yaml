id: kibana-detect
info:
  name: Kibana Detection
  author: method-security
  severity: info
  description: Detects Kibana instances by validating /api/status JSON and Kibana-specific frontend branding/bootstrap markers.
  metadata:
    method-application-type: OBSERVABILITY_PLATFORM
    method-module-name: KIBANA
    cpe: cpe:2.3:a:elastic:kibana:*:*:*:*:*:*:*:*
  tags: discovery,kibana,elastic,observability,observability-platform
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/app/home"
      - "{{BaseURL}}/app/kibana"
      - "{{BaseURL}}/spaces/enter"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "(?i)(kbn-injected-metadata|__kbnPublicPath__|kbnBootstrap|data-test-subj=\"kibanaChrome\")"
