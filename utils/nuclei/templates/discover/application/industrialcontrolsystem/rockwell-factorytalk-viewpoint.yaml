id: rockwell-factorytalk-viewpoint-detect
info:
  name: Rockwell FactoryTalk View / ViewPoint Detection
  author: method-security
  severity: info
  description: Detects Rockwell Automation FactoryTalk View SE, ViewPoint, and FactoryTalk Services Platform web interfaces using Rockwell and FactoryTalk-specific web markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: ROCKWELL_FACTORYTALK_VIEWPOINT
    cpe: cpe:2.3:a:rockwellautomation:factorytalk_view:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,rockwell,factorytalk,viewpoint,view-se
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/FactoryTalk/"
      - "{{BaseURL}}/FTViewPoint/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "factorytalk viewpoint") && (contains(tolower(body), "rockwell automation") || contains(tolower(body), "/ftviewpoint/") || contains(tolower(body), "login") || contains(tolower(body), "<title>factorytalk viewpoint"))'
          - 'contains(tolower(body), "rockwell automation") && contains(tolower(body), "factorytalk") && contains(tolower(body), "viewpoint")'
          - 'contains(tolower(body), "factorytalk services platform") && contains(tolower(body), "rockwell")'
          - 'contains(tolower(body), "factorytalk view se") && contains(tolower(body), "rockwell")'
          - 'contains(tolower(body), "/ftviewpoint/") && contains(tolower(body), "factorytalk")'
