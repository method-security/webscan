imports:
  common: ./common.yml
  method: ../../common/method.yml
types:
  # Specfic GraphQL Structs
  GraphQlField:
    properties:
      name: string
  GraphQlType:
    properties:
      name: string
      kind: string
      description: optional<string>
      fields: optional<list<GraphQlField>>
  GraphQlSchemaData:
    properties:
      types: optional<list<GraphQlType>>
  GraphQlData:
    properties:
      __schema: optional<GraphQlSchemaData>
  GraphQlSchema:
    properties:
      data: optional<GraphQlData>
  GraphQlQuery:
    properties:
      type: string
      fields: optional<list<string>>
  EnumerateGraphqlConfig:
    properties:
      target: string
      headers: optional<map<string, string>>
      timeout: optional<integer>
      query: optional<string>
      variables: optional<string>
  EnumerateGraphqlData:
    properties:
      apiType: common.ApiType
      baseEndpointUrl: string
      version: optional<string>
      schemaUrl: optional<string>
      routes: optional<list<common.ApiApplicationRouteDetails>>
      securitySchemes: optional<map<string, common.SecurityScheme>>
      security: optional<list<common.SecurityRequirement>>
      queries: optional<list<GraphQlQuery>>
      queryResponse: optional<string>
      raw: string
  EnumerateGraphqlResult:
    properties:
      data: optional<EnumerateGraphqlData>
  EnumerateGraphqlReport:
    properties:
      config: EnumerateGraphqlConfig
      result: EnumerateGraphqlResult
      errors: optional<list<string>>

  # GraphQL field wordlist fallback types
  GraphQlConfirmedField:
    properties:
      fieldName: string
      parentType: string
      suggestions: optional<list<string>>

  EnumerateGraphqlFieldWordlistConfig:
    properties:
      target: string
      wordlist: optional<list<string>>
      parentType: optional<string>
      batchSize: optional<integer>
      headers: optional<map<string, string>>
      cookies: optional<map<string, string>>
      timeout: optional<integer>
      verifyTls: optional<boolean>
      userAgent: optional<method.UserAgentPreset>

  EnumerateGraphqlFieldWordlistData:
    properties:
      target: string
      parentType: string
      confirmedFields: optional<list<GraphQlConfirmedField>>

  EnumerateGraphqlFieldWordlistResult:
    properties:
      data: optional<EnumerateGraphqlFieldWordlistData>

  EnumerateGraphqlFieldWordlistReport:
    properties:
      config: EnumerateGraphqlFieldWordlistConfig
      result: EnumerateGraphqlFieldWordlistResult
      errors: optional<list<string>>
