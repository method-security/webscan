id: wordpress-detect
info:
  name: WordPress Detect
  author: method-security
  severity: info
  description: Detects WordPress CMS installations by analyzing response headers and content patterns
  metadata:
    method-application-type: CONTENT_MANAGEMENT_SYSTEM
    method-module-name: WORDPRESS
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  tags: discovery,wordpress,cms
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/wp-admin/install.php"
      - "{{BaseURL}}/feed/"
      - "{{BaseURL}}/?feed=rss2"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "wp engine"
          - "wordpress"
          - "xmlrpc.php"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "wp-json"
          - "wp engine"
          - "wordpress"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "\"generator\" content=\"wordpress"
          - "/wp-admin/load-scripts.php"
          - "/wp-admin/admin-ajax.php"
          - "id=\"wp-admin-bar"
          - "wp-emoji-release.min.js"
          - "/wp-json/"
          - "var wpApiSettings ="
          - "window._wpemojisettings"
        case-insensitive: true