id: generic-redfish-detect
info:
  name: Generic Redfish API Detection
  author: method-security
  severity: info
  description: Detects generic DMTF Redfish service roots exposed by out-of-band management controllers using Redfish service-root JSON markers.
  metadata:
    method-application-type: OUT_OF_BAND_APPLICATION
    method-module-name: GENERIC_REDFISH
    cpe: cpe:2.3:a:dmtf:redfish:*:*:*:*:*:*:*:*
  tags: discovery,redfish,dmtf,bmc,out-of-band,api
http:
  - method: GET
    path:
      - "{{BaseURL}}/redfish/v1/"
      - "{{BaseURL}}/redfish/v1"
    redirects: true
    max-redirects: 3
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(header), "application/json") && contains(body, "\"RedfishVersion\"") && contains(body, "\"@odata.id\"")'
          - 'status_code == 200 && contains(body, "\"@odata.type\"") && contains(body, "#ServiceRoot") && contains(body, "\"Systems\"") && contains(body, "\"Managers\"")'
          - 'status_code == 200 && contains(body, "\"v1\"") && contains(body, "\"redfish\"") && contains(body, "\"SessionService\"")'
