id: aws-management-console-detect
info:
  name: AWS Management Console Detection
  author: method-security
  severity: info
  description: Detects AWS Management Console sign-in and console surfaces using AWS console-specific login and asset markers.
  metadata:
    method-application-type: CLOUD_CONSOLE
    method-module-name: AWS_MANAGEMENT_CONSOLE
    cpe: cpe:2.3:a:amazon:aws_management_console:*:*:*:*:*:*:*:*
  tags: discovery,aws,cloud,console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/signin/"
      - "{{BaseURL}}/signin/v2/"
      - "{{BaseURL}}/console/home"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "aws management console") && (contains(tolower(body), "signin") || contains(tolower(body), "amazon web services"))'
          - 'status_code == 200 && contains(tolower(body), "awsui") && contains(tolower(body), "console.aws.amazon.com")'
          - 'status_code == 200 && contains(tolower(body), "signin.aws.amazon.com") && contains(tolower(body), "aws-account-alias")'
          - 'status_code == 200 && contains(tolower(header), "x-amzn-server: tangerinebox") && contains(tolower(body), "hashargs") && contains(tolower(body), "oauthstart")'
