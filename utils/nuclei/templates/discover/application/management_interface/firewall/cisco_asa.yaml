id: cisco-asa-webmanagement-detect
info:
  name: Cisco ASA Web Management Interface Detection
  author: method-security
  severity: info
  description: Detects Cisco Adaptive Security Appliance (ASA) web management interfaces including ASDM, SSL VPN portals, and admin panels by matching unique ASA-specific assets, headers, and titles.
  metadata:
    method-application-type: MANAGEMENT_INTERFACE_FIREWALL
    method-module-name: CISCO_ASA
  tags: discovery,cisco,asa,adaptive-security-appliance,asdm,firewall,vpn,webvpn
requests:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/+CSCOE+/logon.html"
      - "{{BaseURL}}/+webvpn+/index.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)\+CSCOE\+\/logon\.html'
          - '(?i)\+CSCOU\+\/csco_logo\.gif'
          - '(?i)function\s+CSCO_Format\(fmt\)'
          - '(?i)<title>(Cisco|Cisco ASA|Cisco Systems).*<\/title>'
      - type: word
        part: header
        words:
          - "CSCO_WEBVPN"
          - "webvpn"
        condition: or
        case-insensitive: true
      - type: dsl
        dsl:
          - "favicon_hash == -1354931248"
