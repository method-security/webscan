imports:
  config: ./config.yml
  http: ../../common/http.yml
  probe: ./probe.yml
types:
  NucleiFindingInfo:
    properties:
      name: optional<string>
      finding: boolean
      severity: optional<string>
      tags: optional<list<string>>
  NucleiAttemptInfo:
    properties:
      probeId: string
      httpRequestResponse: http.HttpRequestResponse
      finding: optional<NucleiFindingInfo>
  NucleiTargetInfo:
    properties:
      target: string
      baselineAttempt: optional<NucleiAttemptInfo>
      attempts: optional<list<NucleiAttemptInfo>>
      requestCount: integer
  NucleiReport:
    properties:
      targets: optional<list<NucleiTargetInfo>>
      probes: optional<list<probe.NucleiProbe>>
      config: optional<config.NucleiConfig>

