imports:
  requests: ../common/requests.yml
types:
  # Config Struct
  WebserverProbeStrategy:
    enum:
      - REQUEST
      - BROWSER
  WebserverProbeConfig:
    properties:
      targets: list<string>
      timeout: integer
      strategy: WebserverProbeStrategy
      browserPath: optional<string>
      minDOMStabalizeTime: optional<integer>
  # WebserverProbeReport Struct
  WebserverProbeReport:
    properties:
      targets: optional<list<requests.RequestInfo>>
      config: WebserverProbeConfig
      errors: optional<list<string>>
