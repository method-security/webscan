imports:
  requests: ../common/requests.yml
types:
  # AppFingerprint Enums
  AppFingerprintResourceType:
    enum:
      - APIAPPLICATION
      - CLOUDBUCKET
      - CONTENTMANAGEMENTSYSTEM
      - FRAMEWORK
      - REMOTEACCESS
      - WEBSERVER
      - KUBE
  # Fingerprint File Struct
  AppResourceModule:
    properties:
      name: string
      method: requests.HttpMethod
      paths : list<string>
      RequestParams: optional<requests.RequestParams>
      HeaderIndicators : optional<map<string, optional<list<string>>>>
      BodyIndicators : optional<list<string>>
  AppResourceType:
    properties:
      name: AppFingerprintResourceType
      modules: list<AppResourceModule>
  AppFingerprints:
    properties:
      resourceTypes: list<AppResourceType>
  # Config Struct
  AppFingerprintConfig:
    properties:
      targets: list<string>
      resourceType: string
      modules: optional<list<string>>
      fingerprints: optional<AppResourceType>
      timeout: integer
      successfulOnly: boolean
  # AppFingerprint Struct
  AppFingerprintAttemptInfo:
    properties:
      name: string
      requests: optional<list<requests.RequestInfo>>
      finding : boolean
  AppFingerprintTargetInfo:
    properties:
      target: string
      attempts: list<AppFingerprintAttemptInfo>
  AppFingerprintReport:
    properties:
      targets: optional<list<AppFingerprintTargetInfo>>
      config: AppFingerprintConfig
      errors: optional<list<string>>