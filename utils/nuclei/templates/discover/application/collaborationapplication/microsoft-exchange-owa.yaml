id: microsoft-exchange-owa-detect
info:
  name: Microsoft Exchange OWA / ECP Detection
  author: method-security
  severity: info
  description: Detects Microsoft Exchange Outlook Web App and ECP portals using Exchange-specific OWA paths, cookies, and version headers.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: MICROSOFT_EXCHANGE_OWA
    cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
  tags: discovery,microsoft,exchange,owa,ecp,collaboration
http:
  - method: GET
    path:
      - "{{BaseURL}}/owa/"
      - "{{BaseURL}}/owa/auth/logon.aspx"
      - "{{BaseURL}}/ecp/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "x-owa-version"
          - "x-feserver"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "owa/auth"
          - "microsoft exchange"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "owalgnbdy"
          - "outlook"
        condition: and
        case-insensitive: true
