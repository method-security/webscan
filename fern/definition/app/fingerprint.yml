imports:
  requests: ../common/requests.yml
types:
  # AppFingerprint Enums
  ApiApplicationModule:
    enum:
      - FASTAPI
      - GRAPHQL
      - GRPC
      - SWAGGER
      - K8S
      - WORDPRESS
  CloudBucketModule:
    enum:
      - AWSS3
      - AZUREBLOB
  WebApplicationModule:
    enum:
      - APACHE
      - NGINX
  RemoteAccessModule:
    enum:
      - CITRIXGATEWAY
      - WINDOWSRDP
      - VMWAREHORIZON
  AppFingerprintResourceModule:
    union:
      ApiApplicationModule: ApiApplicationModule
      CloudBucketModule: CloudBucketModule
      WebApplicationModule: WebApplicationModule
      RemoteAccessModule: RemoteAccessModule
  AppFingerprintResourceType:
    enum:
      - APIAPPLICATION
      - CLOUDBUCKET
      - WEBAPPLICATION
      - REMOTEACCESS
  # Config Struct
  AppFingerprintConfig:
    properties:
      targets: list<string>
      modules: list<AppFingerprintResourceModule>
      resourceType: AppFingerprintResourceType
      timeout: integer
      successfulOnly: boolean
  # AppFingerprint Struct
  AppFingerprintAttemptInfo:
    properties:
      name: AppFingerprintResourceModule
      requests: optional<list<requests.RequestInfo>>
      finding : boolean
  AppFingerprintTargetInfo:
    properties:
      target: string
      attempts: list<AppFingerprintAttemptInfo>
  AppFingerprintReport:
    properties:
      targets: optional<list<AppFingerprintTargetInfo>>
      config: AppFingerprintConfig
      errors: optional<list<string>>