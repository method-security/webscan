id: default-tomcat-page-detect
info:
  name: Default Apache Tomcat Welcome Page Detection
  author: method-security
  severity: info
  description: Detects the default Apache Tomcat welcome page that indicates a default installation.
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: TOMCAT
    method-sub-module-name: DEFAULT_PAGE
    method-detection-state: DEFAULT_PAGE
    cpe:
      - cpe:2.3:a:apache:tomcat:*:*:*:*:*:*:*:*
  tags: discovery,tomcat,default-page,misconfiguration
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)<title>Apache\\s+Tomcat/[0-9]+\\.[0-9]+\\.[0-9]+</title>"
      - type: word
        part: body
        words:
          - "If you're seeing this, you've successfully installed Tomcat. Congratulations!"
        case-insensitive: true
