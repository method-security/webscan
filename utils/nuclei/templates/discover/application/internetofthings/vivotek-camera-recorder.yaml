id: vivotek-camera-recorder-detect
info:
  name: VIVOTEK Camera and Recorder Detection
  author: method-security
  severity: info
  description: Detects VIVOTEK camera and NVR web interfaces using VIVOTEK title and HTTP server markers.
  metadata:
    method-application-type: INTERNET_OF_THINGS
    method-module-name: VIVOTEK_CAMERA_RECORDER
    cpe: cpe:2.3:h:vivotek:*:*:*:*:*:*:*:*:*
  tags: discovery,iot,camera,nvr,vivotek
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/cgi-bin/viewer/video.jpg"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "VVTK-HTTP-Server"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*VIVOTEK\s+[A-Z0-9-]+'
          - '(?i)<title>\s*Vivotek\s+[A-Z0-9-]+'
