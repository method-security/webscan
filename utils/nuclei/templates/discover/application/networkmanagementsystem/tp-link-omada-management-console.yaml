id: tp-link-omada-controller-detect
info:
  name: TP-Link Omada Management Console Detection
  author: method-security
  severity: info
  description: Detects TP-Link Omada SDN Controller management consoles using Omada-specific login and controller markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: TP_LINK_OMADA_CONTROLLER
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:a:tp-link:omada_sdn_controller:*:*:*:*:*:*:*:*
  tags: discovery,tp-link,omada,sdn,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/webpages/login.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "<title id=\"title\">omada controller")'
          - 'contains(tolower(body), "<title>omada controller")'
          - 'contains(tolower(body), "omada") && contains(tolower(body), "tp-link") && contains(tolower(body), "controller")'
          - 'contains(tolower(body), "omada sdn") && contains(tolower(body), "login")'
          - 'contains(tolower(body), "tplink omada") && contains(tolower(body), "webpages")'
