types:
  NucleiExpectedMatcher:
    properties:
      type: string
      part: optional<string>
      values: list<string>
  NucleiMatcherDetails:
    properties:
      matcherCondition: string
      matchers: list<NucleiExpectedMatcher>
  NucleiProbe:
    properties:
      id: string # Nuclei Template ID
      payloads: optional<list<string>>
      matcherDetails: optional<list<NucleiMatcherDetails>>
      
