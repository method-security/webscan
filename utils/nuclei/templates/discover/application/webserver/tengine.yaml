id: tengine-detect
info:
  name: Tengine Web Server Detection
  author: method-security
  severity: info
  description: Detects Tengine Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: TENGINE
    cpe: cpe:2.3:a:taobao:tengine:*:*:*:*:*:*:*:*
  tags: discovery,tengine,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/nginx_status"
      - "{{BaseURL}}/reqstat"
      - "{{BaseURL}}/status"
      - "{{BaseURL}}/tengine/"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/upstream_status"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: tengine"
          - "x-powered-by: tengine"
          - "x-served-by: tengine"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)tengine\\s+web\\s+server"
          - "(?i)tengine[\\s/-]+nginx"
          - "(?i)nginx[\\s/-]+tengine"
          - "(?i)tengine[\\s/-]+taobao"
          - "(?i)powered\\s+by\\s+tengine"