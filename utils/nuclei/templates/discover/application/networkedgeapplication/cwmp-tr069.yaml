id: cwmp-tr069-detect
info:
  name: TR-069 / CWMP CPE Management Detection
  author: method-security
  severity: info
  description: |
    Detects TR-069 / CWMP (CPE WAN Management Protocol) endpoints that handle
    SOAP-based provisioning between ISPs and customer-premises equipment.
    The companion to the networkscan TR-069 probe (AITF-81) for webscan
    targets that explicitly include :7547 or other CWMP endpoints in their
    target URL list. Matchers fire on the canonical RomPager embedded
    webserver Server header, dslforum-org / cwmp / ACS realms in
    WWW-Authenticate, and SOAP body / SOAPAction signals.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: TR_069
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:a:broadband-forum:cwmp:*:*:*:*:*:*:*:*
  tags: discovery,tr-069,cwmp,cpe,broadband-forum,network-edge,rompager
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cwmp"
      - "{{BaseURL}}/ACS"
    redirects: true
    max-redirects: 3
    stop-at-first-match: true
    matchers:
      # Matcher 1: RomPager embedded webserver Server header (highest-confidence signal).
      - type: regex
        part: header
        regex:
          - "(?i)Server:\\s*(?:Allegro(?:Soft)?\\s+)?RomPager/"
      # Matcher 2: Basic auth realm leaking ACS / cwmp / dslforum.
      - type: regex
        part: header
        regex:
          - "(?i)WWW-Authenticate:\\s*Basic\\s+realm=\"(?:ACS|cwmp|dslforum-org:cpe-1-0)\""
      # Matcher 3: Digest auth realm leaking DslForumOrg variants.
      - type: regex
        part: header
        regex:
          - "(?i)WWW-Authenticate:\\s*Digest[^\\r\\n]*realm=\"DslForumOrg\""
      # Matcher 4: CWMP SOAP envelope namespace in body.
      - type: word
        part: body
        words:
          - "<cwmp:Inform>"
          - "xmlns:cwmp=\"urn:dslforum-org:cwmp-1-"
        case-insensitive: true
    extractors:
      # Extract RomPager version when present (drives VERSIONED-tier signal +
      # Misfortune Cookie CVE-2014-9222 precondition gating downstream).
      - type: regex
        part: header
        name: rompager_version
        group: 1
        regex:
          - "(?i)Server:\\s*(?:Allegro(?:Soft)?\\s+)?RomPager/([0-9]+\\.[0-9]+(?:\\.[0-9]+)?)"
      # Extract WWW-Authenticate realm — operator-set, frequently leaks ISP
      # / vendor identity (Speedport_Hybrid, BGW210, Hitron, CGNV4, etc.).
      - type: regex
        part: header
        name: auth_realm
        group: 1
        regex:
          - "(?i)WWW-Authenticate:\\s*(?:Basic|Digest)[^\\r\\n]*realm=\"([^\"]+)\""
