id: tenda-router-web-ui-detect
info:
  name: Tenda Router Web Management Detection
  author: method-security
  severity: info
  description: Detects Tenda router web management interfaces using Tenda login titles, GoAhead headers, and login/Auth endpoints.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: TENDA_ROUTER
    cpe: cpe:2.3:h:tenda:*:*:*:*:*:*:*:*:*
  tags: discovery,tenda,router,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/login/Auth"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "<title>tenda") && contains(tolower(body), "login/auth")'
          - 'status_code == 200 && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(header), "server: goahead-webs") && contains(tolower(body), "tenda") && contains(tolower(body), "login")'
          - 'status_code == 200 && !contains(tolower(body), "included with your linksys smart wi-fi") && !contains(tolower(body), "data.sloss.xyz/cloud.js") && !contains(tolower(body), "<title>gpon home gateway") && contains(tolower(body), "tenda") && contains(tolower(body), "goform") && contains(tolower(body), "password")'
