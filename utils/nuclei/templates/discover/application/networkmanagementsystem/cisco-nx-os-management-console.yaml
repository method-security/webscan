id: cisco-nx-os-web-management-detect
info:
  name: Cisco NX-OS Management Console Detection
  author: method-security
  severity: info
  description: Detects Cisco NX-OS switch web management interfaces using NX-OS-specific management titles and administrative path markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_NX_OS
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:o:cisco:nx-os:*:*:*:*:*:*:*:*
  tags: discovery,cisco,nx-os,web-management,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/exec/show/log/CR"
      - "{{BaseURL}}/level/15/exec/-"
      - "{{BaseURL}}/cgi-bin/webcm"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*Cisco.*NX-OS.*(Management|Configuration|Administration).*Interface.*</title>'
          - '(?i)Cisco\s+NX-OS\s+(Configuration|Management|Web\s+Interface)'
          - '(?i)Cisco\s+Switch\s+NX-OS\s+(Management|Configuration)\s+Interface'
      - type: word
        part: body
        words:
          - "Cisco NX-OS"
          - "/exec/show/"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "Cisco NX-OS"
          - "/level/15/"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "Cisco NX-OS"
          - "cgi-bin/webcm"
        condition: and
        case-insensitive: true
