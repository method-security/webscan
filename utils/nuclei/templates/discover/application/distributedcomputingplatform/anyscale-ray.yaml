id: anyscale-ray-detect
info:
  name: Anyscale Ray Platform Detection
  author: method-security
  severity: info
  description: Detects exposed Anyscale Ray distributed computing platform instances, including Ray clusters, dashboards, and management interfaces that provide access to distributed ML/AI workloads.
  metadata:
    method-application-type: DISTRIBUTED_COMPUTING_PLATFORM
    method-module-name: ANYSCALE_RAY
    cpe: cpe:2.3:a:anyscale:ray:*:*:*:*:*:*:*:*
  tags: discovery,anyscale,ray,distributed-computing,machine-learning,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/dashboard"
      - "{{BaseURL}}/ray/dashboard"
      - "{{BaseURL}}/cluster"
      - "{{BaseURL}}/cluster_auth"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "X-Anyscale-Authentication-Status"
          - "X-Anyscale-Api-Key"
          - "X-Anyscale-Baseurl"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "Redirecting to Anyscale to authenticate"
          - "Ray Serve Dashboard"
          - "Ray Jobs Dashboard"
          - "Ray Actor Dashboard"
          - "Ray Task Dashboard"
          - "Ray Cluster Status"
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*Anyscale.*Ray.*(Dashboard|Console|Platform).*</title>'
          - '(?i)Anyscale.*Ray.*(Serve|Jobs|Actor|Task).*Dashboard'