id: nextcloud-detect
info:
  name: Nextcloud Detection
  author: method-security
  severity: info
  description: Detects Nextcloud collaboration deployments using login pages, status endpoint metadata, and Nextcloud-specific assets.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: NEXTCLOUD
    cpe: cpe:2.3:a:nextcloud:nextcloud:*:*:*:*:*:*:*:*
  tags: discovery,nextcloud,collaboration,file-sharing
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/status.php"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "\"productname\":\"nextcloud\""
        case-insensitive: true
      - type: word
        part: body
        words:
          - "nextcloud"
          - "oc_config"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "nextcloud"
          - "/core/img/favicon"
        condition: and
        case-insensitive: true
