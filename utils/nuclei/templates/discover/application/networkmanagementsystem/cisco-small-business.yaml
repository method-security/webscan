id: cisco-small-business-rv-detect
info:
  name: Cisco Small Business RV / SG-Series Router Web Management Detection
  author: method-security
  severity: info
  description: |
    Detects Cisco Small Business RV-series routers (RV0xx, RV34X, RV340) and SG-series managed switches.
    Title/realm anchors plus an optional pre-auth /api/index probe on RV340 firmware that returns JSON
    with the running firmware version.
    No fixture validation — built from catalog signatures (SEC-702 description); confidence lower than TC-backed templates.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_SMALL_BUSINESS
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:cisco:small_business_router_firmware:*:*:*:*:*:*:*:*
  tags: discovery,cisco,small-business,rv-series,sg-series,router,network-management,soho
http:
  # Probe 1: brand+model anchor in HTML title OR basic-auth realm.
  # Three alternative firmware response variants modelled as OR'd
  # dsl expressions — each variant is itself a *multi-token composite*
  # signal that combines status code + brand + product-line / model
  # + (where present) auth scheme. The OR is across firmware response
  # shapes (HTML login page vs 401 with realm), not across single
  # generic anchors, so each variant individually satisfies the Tier-1
  # multi-signal guard.
  #
  # Pattern follows draytek-vigor-web-ui.yaml (sibling template) —
  # one dsl matcher with multiple AND'd variants OR'd at the dsl-list
  # level.
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.htm"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          # Variant 1: HTML login page (status 200) with anchored
          # "Cisco Small Business" title (no preamble allowed) PLUS a
          # Cisco-SB-device-specific path co-signal that is NOT
          # trivially present in the title text — guards against
          # marketing / documentation pages that reuse the phrase.
          # Cisco SB RV-series firmware reliably emits /cgi-bin/
          # paths or a "csbrouter" / "csb" path in linked assets.
          - >-
            status_code == 200 &&
            regex("(?i)<title>\\s*Cisco\\s+Small\\s+Business", body) &&
            (contains(tolower(body), "/cgi-bin/") || contains(tolower(body), "csbrouter") || contains(tolower(body), "csb_"))
          # Variant 2: HTML login page (status 200) with model-bearing
          # "Cisco RV<num>" title PLUS a non-title-trivial Cisco-SB
          # marker. "Small Business" body string (appears in footer /
          # branding distinct from the model title) or a /cgi-bin/
          # device path. The bare word "router" is deliberately NOT
          # in this list — it would false-positive on any router
          # vendor admin page.
          - >-
            status_code == 200 &&
            regex("(?i)<title>\\s*Cisco\\s+RV[0-9]+X?", body) &&
            (contains(tolower(body), "small business") || contains(tolower(body), "/cgi-bin/") || contains(tolower(body), "csbrouter"))
          # Variant 3: 401 response carrying model-bearing basic-auth
          # realm — status code 401 + auth scheme "Basic" + brand
          # "Cisco" + model "RV<num>" + router-class noun. Five
          # composite tokens; the realm itself is a multi-token
          # anchor that rejects pages with only "Cisco" in headers.
          - >-
            status_code == 401 &&
            regex("(?i)Basic\\s+realm=\"Cisco\\s+RV[0-9]+[A-Z0-9 ]*Router\"", header)
    extractors:
      # Realm-derived model.
      - type: regex
        name: model
        part: header
        group: 1
        regex:
          - '(?i)WWW-Authenticate:\s*Basic\s+realm="Cisco\s+(RV[0-9]+[A-Z0-9]*)\s+Router"'
  # Probe 2: RV340 pre-auth /api/index returns JSON with version.
  # This is best-effort — older RV0xx don't expose /api/index.
  - method: GET
    path:
      - "{{BaseURL}}/api/index"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"firmware_version"'
          - '"model"'
        condition: and
        case-insensitive: true
    extractors:
      - type: regex
        name: firmware_version
        part: body
        group: 1
        regex:
          - '"firmware_version"\s*:\s*"([^"]+)"'
      - type: regex
        name: model
        part: body
        group: 1
        regex:
          - '"model"\s*:\s*"([^"]+)"'
