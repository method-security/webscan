id: iconics-genesis64-suite-detect
info:
  name: ICONICS GENESIS64 / Mitsubishi ICONICS Suite Detection
  author: method-security
  severity: info
  description: Detects ICONICS GENESIS64, Mitsubishi Electric ICONICS Suite, MC Works64, MobileHMI, and Hyper Historian web components using strict ICONICS product markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: ICONICS_GENESIS64_SUITE
    cpe: cpe:2.3:a:iconics:genesis64:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,iconics,genesis64,mitsubishi,mobilehmi,hyper-historian
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/GENESIS64/"
      - "{{BaseURL}}/MobileHMI/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "genesis64") && contains(tolower(body), "iconics") && (contains(tolower(body), "/genesis64/") || contains(tolower(body), "login") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "iconics") && contains(tolower(body), "mobilehmi") && (contains(tolower(body), "login") || contains(tolower(body), "<title") || contains(tolower(body), "/mobilehmi/"))'
          - 'contains(tolower(body), "iconics") && contains(tolower(body), "hyper historian") && (contains(tolower(body), "login") || contains(tolower(body), "<title") || contains(tolower(body), "/hyperhistorian/"))'
          - 'contains(tolower(body), "mitsubishi electric") && contains(tolower(body), "mc works64") && (contains(tolower(body), "login") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "/genesis64/") && contains(tolower(body), "iconics")'
