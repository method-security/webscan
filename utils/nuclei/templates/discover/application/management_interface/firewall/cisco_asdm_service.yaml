id: cisco-asdm-service-detect
info:
  name: Cisco ASDM Service Detection
  author: method-security
  severity: info
  description: Detects Cisco Adaptive Security Device Manager (ASDM) interfaces including Java Web Start launchers, ASDM download pages, and admin portals using unique Cisco ASA ASDM assets, titles, and file indicators.
  metadata:
    method-application-type: MANAGEMENT_INTERFACE_FIREWALL
    method-module-name: CISCO_ASDM
  tags: discovery,cisco,asdm,asa,firewall,webvpn
requests:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/+CSCOE+/logon.html"
      - "{{BaseURL}}/asdm/"
      - "{{BaseURL}}/asdm/asdm.jnlp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*(ASDM|Adaptive Security Device Manager).*</title>'
          - '(?i)asdm.*(java\s*web\s*start|launcher|jnlp)'
          - '(?i)cisco.*asdm.*(download|launch)'
          - '(?i)application/x-java-jnlp-file'
          - '(?i)/asdm/asdm\.jnlp'
      - type: word
        part: body
        words:
          - "ASDM Launcher"
          - "Adaptive Security Device Manager"
          - "asdm.jnlp"
          - "webstart.jnlp"
          - "cisco_asdm_logo"
        case-insensitive: true