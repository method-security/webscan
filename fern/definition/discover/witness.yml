imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  DetectedTechnologyType:
    enum:
      - UI_FRAMEWORK
      - JAVASCRIPT_LIBRARY
      - CSS_FRAMEWORK
      - CLIENT_ANALYTICS
      - CLIENT_WIDGET
      - PROGRAMMING_LANGUAGE
      - WEB_FRAMEWORK
      - RUNTIME
      - TEMPLATE_ENGINE
      - AUTHENTICATION_LIBRARY
      - UNCATEGORIZED
  # Wappalyzer Technology Struct
  DetectedTechnology:
    properties:
      name: string
      version: optional<string>
      categories: list<string>
      technologyType: optional<DetectedTechnologyType>
      cpe: optional<string>
      description: optional<string>
      website: optional<string>
  DiscoverWitnessTechnologies:
    properties:
      clientSide: optional<list<DetectedTechnology>>
      serverSide: optional<list<DetectedTechnology>>
      other: optional<list<DetectedTechnology>>
  DiscoverWitnessFavicon:
    properties:
      url: string
      binary: base64
      hash: string
  # Function Config Struct
  DiscoverWitnessConfig:
    properties:
      target: string
      responseCodes: string
      screenshot: boolean
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      ignoreCrossDomainRedirects: boolean
      userAgent: method.UserAgentPreset
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
      headers: optional<map<string, string>>
      cookies: optional<map<string, string>>
      localStorage: optional<map<string, string>>
      sessionStorage: optional<map<string, string>>
  # Result Struct
  DiscoverWitnessResult:
    properties:
      target: string
      request: http.HttpRequestResponse
      screenshot: optional<base64>
      screenshotPerceptualHash: optional<string>
      favicon: optional<DiscoverWitnessFavicon>
      technologies: optional<DiscoverWitnessTechnologies>
  # Report Struct
  DiscoverWitnessReport:
    properties:
      config: DiscoverWitnessConfig
      result: DiscoverWitnessResult
      errors: optional<list<string>>
