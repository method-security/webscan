id: hp-ews-detect
info:
  name: HP Embedded Web Server (EWS) Printer / MFP Detection
  author: method-security
  severity: info
  description: |
    Detects HP printer / multifunction-printer Embedded Web Server (EWS)
    management interfaces. The high-signal pre-auth disclosure endpoint
    /hp/device/InternalPages/Index?id=DeviceInformation returns plaintext
    device info on the JetDirect / Universal-Print EWS line (LaserJet,
    OfficeJet, PageWide, Color LaserJet families). Extractors capture
    model name, firmware version, and serial number; version-tier
    detection-state promotion lands with the SEC-702.A schema work
    (tool-factory/sec-702 / #423).
    Catalog reference: SEC-702 — Cluster O (printers).
  metadata:
    method-application-type: HARDWARE_MANAGEMENT_SYSTEM
    method-module-name: HP_EWS
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:hp:embedded_web_server:*:*:*:*:*:*:*:*
  tags: discovery,hp,ews,printer,mfp,hardware,management-console
http:
  - method: GET
    path:
      - "{{BaseURL}}/hp/device/InternalPages/Index?id=DeviceInformation"
    redirects: true
    max-redirects: 5
    matchers-condition: and
    matchers:
      # Anchor on the device-info page's labelled rows. Match all
      # three to rule out a generic 401/redirect page.
      - type: word
        part: body
        words:
          - "Product Name"
          - "Firmware"
          - "Serial Number"
        condition: and
        case-insensitive: true
      - type: status
        status:
          - 200
    extractors:
      # Model — varies in label form across firmware generations
      # ("Product Name", "Model Name", "Device Model"). Two regex
      # variants cover the typical "<th>Label</th><td>Value</td>"
      # EWS table shape and the plain "Label: Value" text variant.
      - type: regex
        name: model
        part: body
        group: 1
        regex:
          - '(?is)(?:Product Name|Model Name|Device Model)\s*</?[a-zA-Z]+[^>]*>\s*<[a-zA-Z]+[^>]*>\s*([A-Za-z0-9][A-Za-z0-9 \-/_.]+?)\s*<'
          - '(?is)(?:Product Name|Model Name|Device Model)[^<>\r\n]*?[:>]\s*([A-Za-z0-9][A-Za-z0-9 \-/_.]+?)\s*[<\r\n]'
      # Firmware version — HP firmware revisions follow vendor-specific
      # forms (e.g. 002.2402A.00.05, FutureSmart 5.6). HP EWS device-info
      # pages typically expose BOTH "Firmware Datecode" (a YYYYMMDD-style
      # build date) AND "Firmware Version" (or "Firmware Revision") in
      # that order on the same page; we want the version, not the
      # datecode. The regex requires the explicit "Version" / "Revision"
      # label and rejects "Datecode" by being label-specific.
      # The .*? between the label and the value spans the typical EWS
      # table shape "<th>Firmware Version</th><td>...</td>" plus any
      # plain "Firmware Version: ..." text variant.
      - type: regex
        name: firmware
        part: body
        group: 1
        regex:
          - '(?is)Firmware\s*(?:Version|Revision)\s*</?[a-zA-Z]+[^>]*>\s*<[a-zA-Z]+[^>]*>\s*([A-Za-z0-9][A-Za-z0-9 ._\-]+?)\s*<'
          - '(?is)Firmware\s*(?:Version|Revision)[^<>\r\n]*?[:>]\s*([A-Za-z0-9][A-Za-z0-9 ._\-]+?)\s*[<\r\n]'
      # Firmware datecode — captured separately as named informational
      # metadata; useful for downstream correlation and not conflated
      # with the version string.
      - type: regex
        name: firmware_datecode
        part: body
        group: 1
        regex:
          - '(?is)Firmware\s*Datecode\s*</?[a-zA-Z]+[^>]*>\s*<[a-zA-Z]+[^>]*>\s*([A-Za-z0-9][A-Za-z0-9 ._\-]+?)\s*<'
          - '(?is)Firmware\s*Datecode[^<>\r\n]*?[:>]\s*([A-Za-z0-9][A-Za-z0-9 ._\-]+?)\s*[<\r\n]'
      # Serial number — alphanumeric, ≥6 chars. Two regex variants
      # cover the typical "<th>Serial Number</th><td>Value</td>" EWS
      # table shape and the plain "Serial Number: Value" text variant.
      - type: regex
        name: serial
        part: body
        group: 1
        regex:
          - '(?is)Serial\s*Number\s*</?[a-zA-Z]+[^>]*>\s*<[a-zA-Z]+[^>]*>\s*([A-Z0-9]{6,20})\s*<'
          - '(?is)Serial\s*Number[^<>\r\n]*?[:>]\s*([A-Z0-9]{6,20})\s*[<\r\n]'
