id: barracuda-email-security-gateway-detect
info:
  name: Barracuda Email Security Gateway Management Console Detection
  author: method-security
  severity: info
  description: Detects exposed Barracuda Email Security Gateway management consoles by identifying login pages, admin CGI endpoints, and Barracuda-specific branding elements.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: BARRACUDA_EMAIL_SECURITY_GATEWAY
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:h:barracuda:email_security_gateway:*:*:*:*:*:*:*:*
  tags: discovery,barracuda,email,security,gateway,spam,firewall,management-console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cgi-bin/index.cgi"
      - "{{BaseURL}}/cgi-mod/index.cgi"
      - "{{BaseURL}}/login.cgi"
      - "{{BaseURL}}/admin/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Barracuda Email Security Gateway"
          - "Barracuda Spam Firewall"
          - "Barracuda Message Archiver"
          - "Barracuda Web Security Gateway"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*Barracuda.*Email.*Security.*Gateway.*</title>'
          - '(?i)<title[^>]*>.*Barracuda.*Spam.*Firewall.*</title>'
          - '(?i)<title[^>]*>.*Barracuda.*Message.*Archiver.*</title>'
          - '(?i)Barracuda.*Email.*Security.*Gateway.*Login'
          - '(?i)Barracuda.*Spam.*Firewall.*Login'
      - type: word
        part: body
        words:
          - "Barracuda Networks"
          - "/cgi-bin/index.cgi"
          - "/cgi-mod/index.cgi"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "Barracuda"
          - "Email Security"
        case-insensitive: true
        condition: and
      - type: regex
        part: body
        regex:
          - '(?i)barracuda.*networks.*inc'
          - '(?i)copyright.*barracuda.*networks'
          - '(?i)barracuda.*email.*security'
      - type: word
        part: header
        words:
          - "Server: Barracuda Email Security"
          - "Server: Barracuda Spam Firewall"
        case-insensitive: true
      - type: regex
        part: header
        regex:
          - '(?i)Server:.*Barracuda.*Email'
          - '(?i)Server:.*Barracuda.*Spam'
      - type: dsl
        dsl:
          - 'contains(tolower(body), "barracuda") && (contains(tolower(body), "email security") || contains(tolower(body), "spam firewall") || contains(tolower(body), "message archiver")) && (contains(tolower(body), "login") || contains(tolower(body), "cgi-bin") || contains(tolower(body), "admin"))'
