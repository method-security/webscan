id: cisco-dcnm-detect
info:
  name: Cisco Data Center Network Manager (DCNM) Detection
  author: method-security
  severity: info
  description: Detects Cisco Data Center Network Manager (DCNM) web management interfaces by matching unique DCNM UI and API endpoints.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_DCNM
    cpe: cpe:2.3:a:cisco:data_center_network_manager:*:*:*:*:*:*:*:*
  tags: discovery,cisco,dcnm,network-management-system
requests:
  - method: GET
    path:
      - "{{BaseURL}}/dcnm-rest/v1/"
      - "{{BaseURL}}/dcnm-rest/"
      - "{{BaseURL}}/dcnm/login"
      - "{{BaseURL}}/dcnm/home"
      - "{{BaseURL}}/dcnm/"
      - "{{BaseURL}}/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)"(dcnmVersion|dcnmVersionInfo)"'
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)/dcnm/app/ui/'
          - '(?i)/dcnm/app/ui/js/'
          - '(?i)/dcnm/app/ui/css/'
      - type: word
        part: body
        words:
          - "Cisco DCNM"
          - "Cisco Data Center Network Manager"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)dcnm-logo'
          - '(?i)cisco-logo.*dcnm'
        matchers-condition: and

