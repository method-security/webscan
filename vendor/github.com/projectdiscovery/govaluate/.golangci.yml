version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Correctness checks (SA*) stay on. The few purely-stylistic checks below
      # are disabled because the code was forked in from an upstream GOPATH-era
      # project and trips them pervasively; reworking them is out of scope for
      # the repo-modernization effort and would touch evaluation behavior.
      checks:
        - all
        - -ST1* # stylecheck naming/comment conventions; ST1003 would rename exported API consts
        - -QF1001 # apply De Morgan's law (rewrites parser boolean logic)
        - -S1034 # assign type assertion in switch (rewrites core eval paths)
        - -SA4004 # loop unconditionally terminated (legacy planner pattern)
  exclusions:
    rules:
      # Benchmarks and torture tests intentionally discard Evaluate/parse errors.
      - path: _test\.go
        linters:
          - errcheck
      # `kind` is reset each token and read on the no-match fall-through path;
      # the assignment is load-bearing, the analyzer flags it as redundant.
      - path: parsing\.go
        linters:
          - ineffassign
        text: kind
