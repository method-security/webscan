imports:
  config: ./config.yml
  http: ../../common/http.yml
  probe: ./probe.yml
types:
  CweDetails:
    properties:
      id: string
  CveDetails:
    properties:
      id: string
      cvssMetrics: optional<string>
      cvssScore: optional<float>
      epssScore: optional<float>
      epssPercentile: optional<float>
      cpe: optional<string>
  ClassificationDetails:
    properties:
      cwes: optional<list<CweDetails>>
      cves: optional<list<CveDetails>>
  NucleiFindingInfo:
    properties:
      name: optional<string>
      description: optional<string>
      impact: optional<string>
      remediation: optional<string>
      reference: optional<list<string>>
      classification: optional<ClassificationDetails>
      severity: optional<string>
      finding: boolean
      probe: optional<probe.NucleiProbe>
  NucleiAttemptInfo:
    properties:
      templateId: string # Nuclei template ID
      httpRequestResponse: http.HttpRequestResponse
      finding: optional<NucleiFindingInfo>
  NucleiTargetInfo:
    properties:
      target: string
      baselineAttempt: optional<NucleiAttemptInfo>
      attempts: optional<list<NucleiAttemptInfo>>
