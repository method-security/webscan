id: influxdb-ui-detect
info:
  name: InfluxDB UI Detection
  author: method-security
  severity: info
  description: Detects InfluxDB web administration UI using InfluxDB-specific bootstrap and static asset markers.
  metadata:
    method-application-type: DATABASE_MANAGEMENT_APPLICATION
    method-module-name: INFLUXDB
    cpe: cpe:2.3:a:influxdata:influxdb:*:*:*:*:*:*:*:*
  tags: discovery,database,admin,influxdb
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/signin"
      - "{{BaseURL}}/orgs"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>influxdb"
          - "/assets/"
        condition: and
        case-insensitive: true
      - type: word
        part: all
        words:
          - "x-influxdb-version"
          - "x-influxdb-build"
          - "<title>influxdb"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "influxdb"
          - "window.influx"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "influxdata"
          - "signin"
          - "orgs"
        condition: and
        case-insensitive: true
