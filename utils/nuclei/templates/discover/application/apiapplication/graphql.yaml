id: graphql-detect
info:
  name: GraphQL API Detection
  author: method-security
  severity: info
  description: Detects GraphQL endpoints by sending an introspection-style POST query to common GraphQL paths
  metadata:
    method-application-type: API_APPLICATION
    method-module-name: GRAPHQL
    cpe: cpe:2.3:a:graphql:graphql:*:*:*:*:*:*:*:*
  tags: discovery,graphql,api
http:
  - method: POST
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/v1/graphql"
      - "{{BaseURL}}/v2/graphql"
      - "{{BaseURL}}/graphql/v1"
      - "{{BaseURL}}/graphql/v2"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/api"
      - "{{BaseURL}}/gql"
      - "{{BaseURL}}/api/gql"
      - "{{BaseURL}}/graphiql"
      - "{{BaseURL}}/api/graphiql"
      - "{{BaseURL}}/admin/graphql"
      - "{{BaseURL}}/api/v1/graphql"
      - "{{BaseURL}}/api/v2/graphql"
    headers:
      Content-Type: application/json
    body: '{"query": "{ __schema { queryType { name } } }"}'
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "__schema"
          - "queryType"
        condition: and
        case-insensitive: true