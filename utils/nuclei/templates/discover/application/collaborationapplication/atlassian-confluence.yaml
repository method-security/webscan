id: atlassian-confluence-detect
info:
  name: Atlassian Confluence Detection
  author: method-security
  severity: info
  description: Detects Atlassian Confluence collaboration sites using Confluence login paths, AJS metadata, and branded page assets.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: ATLASSIAN_CONFLUENCE
    cpe: cpe:2.3:a:atlassian:confluence:*:*:*:*:*:*:*:*
  tags: discovery,atlassian,confluence,collaboration
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.action"
      - "{{BaseURL}}/confluence/login.action"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "atlassian confluence")'
          - 'contains(tolower(body), "confluence") && contains(tolower(body), "/s/") && contains(tolower(body), "com.atlassian.confluence")'
          - 'contains(tolower(body), "confluence-base-url") && contains(tolower(body), "confluence")'
