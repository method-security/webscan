imports:
  http: ../../common/http.yml
types:
  # Function Config Struct
  EnumerateWebserverIisConfig:
    properties:
      targets: list<string>
      verifyTLS: boolean
      timeout: integer
      threads: integer
  # Report Struct
  IisWebServerDetails:
    properties:
      name: string
      version: optional<string>
  IisWebFrameworkDetails:
    properties:
      name: string
      version: optional<string>
  IisSiteDetails:
    properties:
      server: optional<IisWebServerDetails>
      frameworks: optional<list<IisWebFrameworkDetails>>
      authenticationMethods: optional<list<string>>
  EnumerateWebserverIisTarget:
    properties:
      target: string
      site: optional<IisSiteDetails>
      requests: optional<list<http.HttpRequestResponse>>
  EnumerateWebserverIisReport:
    properties:
      targets: optional<list<EnumerateWebserverIisTarget>>
      config: EnumerateWebserverIisConfig
      errors: optional<list<string>>
