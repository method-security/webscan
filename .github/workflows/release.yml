name: 🎉 Release

on:
  workflow_call:

jobs:
  release:
    name: Release
    uses: ./.github/workflows/reusable-build.yml
    with:
      goreleaser_config: goreleaser.yml
      goreleaser_options: "--clean"
    secrets: inherit
    permissions:
      id-token: write # For cosign
      packages: write # For GHCR
      contents: write # To upload archives as release assets

  publish:
    name: Publish PyPi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6

      - name: Install Fern
        run: npm install -g fern-api

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # ratchet:actions/setup-python@v6
        with:
          python-version: "3.13"

      # Fern Definition generation now runs locally; package upload is explicit.
      - name: Generate and build Python package
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PACKAGE_NAME: methodwebscan
          PACKAGE_VERSION: "${{ github.ref_name }}"
        run: |
          python3 -m pip install build==1.6.1 twine==7.0.0
          fern generate --local --preview --group pypi --output generated/python-package
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("generated/python-package/fern-pydantic-model/pyproject.toml")
          content = path.read_text()
          content, names = re.subn(r'^name = ".*"$', 'name = "' + os.environ["PACKAGE_NAME"] + '"', content, flags=re.MULTILINE)
          content, versions = re.subn(r'^version = ".*"$', 'version = "' + os.environ["PACKAGE_VERSION"].removeprefix("v") + '"', content, flags=re.MULTILINE)
          if (names, versions) != (2, 1):
              raise RuntimeError("Unexpected generated Python package metadata")
          content = content.replace("Repository = ''", 'Repository = "https://github.com/method-security/webscan"')
          path.write_text(content)
          path.with_name("README.md").write_text(
              "# " + os.environ["PACKAGE_NAME"] + "\n\n"
              "Python data models generated from the "
              "[Method Security webscan definitions](https://github.com/method-security/webscan).\n"
          )
          PYTHON
          python3 -m build --outdir generated/python-dist generated/python-package/fern-pydantic-model
          python3 -m twine check generated/python-dist/*

      - name: Upload Python package
        run: python3 -m twine upload --verbose --non-interactive --repository-url https://upload.pypi.org/legacy/ generated/python-dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

    permissions:
      id-token: write # For cosign
      packages: write # For GHCR
      contents: write # To upload archives as release assets

  upload-to-s3:
    name: Upload to S3
    needs: [release]
    uses: ./.github/workflows/upload-to-s3.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
