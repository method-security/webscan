id: moveit-transfer-detect
info:
  name: MOVEit Transfer Application Detection
  author: method-security
  severity: info
  description: Detects MOVEit Transfer managed file transfer application by identifying login pages, authentication endpoints, and MOVEit-specific branding elements.
  metadata:
    method-application-type: FILE_TRANSFER_APPLICATION
    method-module-name: MOVEIT_TRANSFER
  tags: discovery,moveit,file-transfer,mft
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/human.aspx"
      - "{{BaseURL}}/login.aspx"
      - "{{BaseURL}}/guestaccess.aspx"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*MOVEit\s*Transfer.*</title>'
          - '(?i)MOVEit\s*Transfer\s*(Login|Web\s*Access|Management\s*Console)'
          - '(?i)Progress\s*Software.*MOVEit\s*Transfer'
      - type: word
        part: body
        words:
          - "moveitisapi"
          - "stylesheet_MOVEit"
          - "com.progress.moveit.transfer"
        case-insensitive: true
      - type: word
        part: all
        words:
          - "moveitisapi"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)stylesheet_MOVEit[^"]*\.css'
          - '(?i)app-id=com\.progress\.moveit\.transfer'
          - '(?i)author.*Progress\s+Software\s+Corporation'
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "moveit transfer") && (contains(tolower(body), "moveitisapi") || contains(tolower(body), "stylesheet_moveit") || contains(tolower(body), "com.progress.moveit.transfer") || contains(tolower(body), "human.aspx"))'
