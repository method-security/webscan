id: zws-detect
info:
  name: ZWS Web Server Detection
  author: method-security
  severity: info
  description: Detects ZWS (Zope Web Server) installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: ZWS
  tags: discovery,zws,zope,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/manage"
      - "{{BaseURL}}/manage_main"
      - "{{BaseURL}}/Control_Panel/"
      - "{{BaseURL}}/acl_users/"
      - "{{BaseURL}}/p_/webdav/"
      - "{{BaseURL}}/misc_/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: zope"
          - "server: zserver"
          - "server: zws"
          - "x-powered-by: zope"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)zope\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)zope\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)zserver\\s*[0-9]+\\.[0-9]+"
          - "(?i)powered\\s+by\\s+zope"
          - "(?i)zope\\s+(management|application)\\s+server"