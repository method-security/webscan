id: apache-guacamole-detect
info:
  name: Apache Guacamole Detection
  author: method-security
  severity: info
  description: Detects Apache Guacamole remote access gateways using Guacamole-specific titles, client assets, and API paths.
  metadata:
    method-application-type: VDI_APPLICATION
    method-module-name: APACHE_GUACAMOLE
    cpe: cpe:2.3:a:apache:guacamole:*:*:*:*:*:*:*:*
  tags: discovery,apache,guacamole,remote-access,vdi,jump
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/guacamole/"
      - "{{BaseURL}}/guacamole/#/"
      - "{{BaseURL}}/guacamole/api/languages"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Apache Guacamole"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "guacamole-client"
          - "app.js"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "guacamole"
          - "api/tokens"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "guacamole-logo"
        case-insensitive: true
