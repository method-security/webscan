imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # Enums
  SensitiveContextConfidenceLevel:
    enum:
      - HIGH
      - MEDIUM
      - LOW 
  # Sensitive Context Structs
  SensitiveContextFingerprint:
    properties:
      type: string
      pattern: string
      confidence: SensitiveContextConfidenceLevel
  SensitiveContextFingerprints:
    properties:
      fingerprints: list<SensitiveContextFingerprint>
  SensitiveContext:
    properties:
      value: string
      fingerprint: SensitiveContextFingerprint
  # Function Config Struct
  DiscoverPageConfig:
    properties:
      target: string
      sensitiveContextDetection: boolean
      responseCodes: string
      screenshot: boolean
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
  DiscoverPageResult:
    properties:
      request: optional<http.HttpRequestResponse>
      screenshot: optional<base64>
      sensitiveContexts: optional<list<SensitiveContext>>
  # Report Struct
  DiscoverPageReport:
    properties:
      config: DiscoverPageConfig
      result: DiscoverPageResult
      errors: optional<list<string>>
