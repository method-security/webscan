id: cisco-asa-webmanagement-detect
info:
  name: Cisco ASA Device Detection
  author: method-security
  severity: info
  description: >
    Detects Cisco Adaptive Security Appliance (ASA) web management interfaces
    (ASDM / SSL VPN) by matching common ASA strings/paths/titles and expected
    management HTTP status codes.
  metadata:
    method-application-type: NETWORK_FIREWALL
    method-module-name: CISCO_ASA
    cpe: cpe:2.3:a:cisco:adaptive_security_appliance:*:*:*:*:*:*:*:*
  tags: discovery,cisco,asa,asdm,network-firewall,vpn,webvpn
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/+CSCOE+/logon.html"
      - "{{BaseURL}}/+webvpn+/index.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      # body must contain any one of these ASA indicators
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>(?:Cisco ASA|Adaptive Security Appliance)[^<]*</title>'
      - type: word
        part: header
        words:
          - 'x-cisco-asdm'
          - 'CSCO_WEBVPN'
        case-insensitive: true
