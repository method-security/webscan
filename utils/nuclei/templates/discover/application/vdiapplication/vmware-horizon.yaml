id: vmware-horizon-detect
info:
  name: VMware Horizon Detection
  author: method-security
  severity: info
  description: Detects VMware Horizon installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: VDI_APPLICATION
    method-module-name: VMWARE_HORIZON
  tags: discovery,vmware,horizon,vdi
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/portal/"
      - "{{BaseURL}}/broker/"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/portal/webclient/index.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "VMware Horizon"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)vmware\\s+horizon"
          - "(?i)horizon\\s+view\\s+[0-9]+\\.[0-9]+"
          - "(?i)horizon\\s+(connection|workspace)\\s+server"
          - "(?i)blast\\s+secure\\s+gateway"