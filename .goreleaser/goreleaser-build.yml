version: 2

project_name: webscan

builds:
  - id: build-linux
    main: .
    binary: webscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/method-security/webscan/main.version={{.Version}}

  - id: build-macos
    main: .
    binary: webscan
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64

  - id: build-windows
    main: .
    binary: webscan
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
