id: fortigate-vpn-detect
info:
  name: Fortinet FortiGate VPN Detection
  author: method-security
  severity: info
  description: Detects Fortinet FortiGate VPN installations by analyzing response
    headers, body content, and common paths
  reference: https://www.fortinet.com/products/next-generation-firewall
  metadata:
    method-application-type: REMOTE_ACCESS
    method-module-name: FORTIGATE_VPN
  tags: tech,fortinet,fortigate,vpn,remote-access
http:
- method: GET
  path:
  - '{{BaseURL}}'
  - '{{BaseURL}}/remote/login'
  - '{{BaseURL}}/remote/logincheck'
  - '{{BaseURL}}/remote/fortisslvpn_xml'
  - '{{BaseURL}}/remote/fgt_lang'
  - '{{BaseURL}}/fgtauth'
  - '{{BaseURL}}/remote/hostcheck'
  - '{{BaseURL}}/sslvpn/'
  - '{{BaseURL}}/remote/'
  stop-at-first-match: true
  matchers-condition: or
  matchers:
  - type: word
    part: header
    words:
    - 'server: fortigate'
    - 'server: fortiweb'
    - 'x-frame-options: fortinet'
    - 'x-powered-by: fortinet'
    case-insensitive: true
  - type: regex
    part: body
    regex:
    - (?i)forti(gate|ssl|net).*?[0-9]+\.[0-9]+\.[0-9]+
    - (?i)fortios.*?v[0-9]+\.[0-9]+
    - (?i)fgtauth.*?[a-zA-Z0-9]{8,}
    - (?i)fortisslvpn.*?xml
