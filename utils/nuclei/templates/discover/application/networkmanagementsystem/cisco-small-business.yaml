id: cisco-small-business-rv-detect
info:
  name: Cisco Small Business RV / SG-Series Router Web Management Detection
  author: method-security
  severity: info
  description: |
    Detects Cisco Small Business RV-series routers (RV0xx, RV34X, RV340) and SG-series managed switches.
    Title/realm anchors plus an optional pre-auth /api/index probe on RV340 firmware that returns JSON
    with the running firmware version.
    No fixture validation — built from catalog signatures (SEC-702 description); confidence lower than TC-backed templates.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_SMALL_BUSINESS
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:cisco:small_business_router_firmware:*:*:*:*:*:*:*:*
  tags: discovery,cisco,small-business,rv-series,sg-series,router,network-management,soho
http:
  # Probe 1: anchored title / WWW-Authenticate realm.
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.htm"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      # Anchored title — Cisco Small Business / Cisco RV34X login page.
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*Cisco\s+Small\s+Business'
          - '(?i)<title>\s*Cisco\s+RV[0-9]+X?'
      # WWW-Authenticate realm — the realm string carries the model
      # ("Cisco RV340 Router" etc.). Rejects realms that only contain
      # the word "Cisco" generically.
      - type: regex
        part: header
        regex:
          - '(?i)WWW-Authenticate:\s*Basic\s+realm="Cisco\s+RV[0-9]+[A-Z0-9 ]*Router"'
    extractors:
      # Realm-derived model.
      - type: regex
        name: model
        part: header
        group: 1
        regex:
          - '(?i)WWW-Authenticate:\s*Basic\s+realm="Cisco\s+(RV[0-9]+[A-Z0-9]*)\s+Router"'
  # Probe 2: RV340 pre-auth /api/index returns JSON with version.
  # This is best-effort — older RV0xx don't expose /api/index.
  - method: GET
    path:
      - "{{BaseURL}}/api/index"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"firmware_version"'
          - '"model"'
        condition: and
        case-insensitive: true
    extractors:
      - type: regex
        name: firmware_version
        part: body
        group: 1
        regex:
          - '"firmware_version"\s*:\s*"([^"]+)"'
      - type: regex
        name: model
        part: body
        group: 1
        regex:
          - '"model"\s*:\s*"([^"]+)"'
