id: wordpress-detect

info:
  name: WordPress Detect
  author: pdteam,daffainfo,ricardomaia,topscoder,AdamCrosser,method-security
  severity: info
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: wordpress
    product: wordpress
    shodan-query:
      - http.component:"WordPress"
      - http.component:"wordpress"
      - cpe:"cpe:2.3:a:wordpress:wordpress"
    category: cms
    method-application-type: API_APPLICATION
    method-module-name: WORDPRESS
  tags:
    - tech
    - wordpress
    - cms
    - wp

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/wp-admin/install.php"
      - "{{BaseURL}}/feed/"
      - "{{BaseURL}}/?feed=rss2"
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)x-powered-by:\s*wordpress'
          - '(?i)link:\s*<https?:\/\/.*\/wp-json\/>'
          - '(?i)x-redirect-by:\s*WordPress'
      - type: word
        part: body
        words:
          - wp-content
          - wp-includes
          - wp-login.php
          - xmlrpc.php
          - wp-json
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)<generator>.*wordpress\.org.*</generator>'
          - '(?i)<!--[^>]*(Yoast|WP-Super-Cache)[^>]*-->'
          - '/wp-content/uploads/'
          - '(?i)yoast\.com/wordpress/plugins/seo'