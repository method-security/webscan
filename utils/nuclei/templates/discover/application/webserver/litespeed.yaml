id: litespeed-detect
info:
  name: LiteSpeed Web Server Detection
  author: method-security
  severity: info
  description: Detects LiteSpeed Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEBSERVER
    method-module-name: LITESPEED
  tags: discovery,litespeed,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/docs/"
      - "{{BaseURL}}/manual/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: litespeed"
          - "server: lsws"
          - "x-lsws-server"
          - "x-powered-by: litespeed"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)litespeed\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)litespeed\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)lsws\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)openlitespeed\\s*[0-9]+\\.[0-9]+"
          - "(?i)powered\\s+by\\s+litespeed"
          - "(?i)litespeed\\s+(enterprise|cache|admin)"