name: 🙏🏻 Verify

on:
  workflow_call:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Warn on test artifacts in changed code
        run: |
          base="${{ github.base_ref }}"
          if [ -n "$base" ]; then
            # Pull request: scan the full PR range against the target branch.
            git fetch --no-tags origin "$base" || true
            python3 scripts/check-test-artifacts.py --base "origin/$base" --github
          else
            # Push: scan the whole pushed range (event.before...HEAD), not just
            # the tip commit. event.before is all-zeros on branch creation.
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) before="HEAD~1" ;;
            esac
            python3 scripts/check-test-artifacts.py --base "$before" --github
          fi

      - name: Download Fern Generated Code (Go)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: fern-generated-code
          path: generated/

      - name: Download Embedded Asset Archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: embedded-asset-archives
          path: .

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Godel Verify
        run: ./godelw verify
