id: discover-azure-blob
info:
  name: Azure Blob Storage Discovery
  author: method-security
  severity: info
  description: Detects Azure Blob Storage endpoints
  metadata:
    method-application-type: CLOUD_BUCKET
    method-module-name: AZUREBLOB
    cpe: cpe:2.3:a:microsoft:azure_blob_storage:*:*:*:*:*:*:*:*
  tags: discovery,azure,blob,cloud
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 403
      - type: word
        part: header
        words:
          - "server: blob"
          - "x-ms-blob-type"
          - "x-ms-version"
        case-insensitive: true