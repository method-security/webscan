imports:
  http: ../../common/http.yml
  method: ../../common/method.yml
  waf: ../../common/waf.yml
types:
  # Config Struct
  EnumerateRateLimitConfig:
    properties:
      targets: list<string>
      maxRequests: integer
      sleep: integer
      jitter: integer
      verifyTls: boolean
      timeout: integer
      threads: integer
      userAgent: method.UserAgentPreset
  # Report Struct
  RateLimitAttempt:
    properties:
      requestNumber: integer
      request: http.HttpRequestResponse
      provider: waf.WafProviderEnum
      fingerprint: optional<waf.WafFingerprint>
  RateLimitTarget:
    properties:
      target: string
      startTimestamp: datetime
      endTimestamp: datetime
      detectedRequest: optional<RateLimitAttempt>
  EnumerateRateLimitResult:
    properties:
      targets: optional<list<RateLimitTarget>>
  EnumerateRateLimitReport:
    properties:
      config: EnumerateRateLimitConfig
      result: EnumerateRateLimitResult
      errors: optional<list<string>>
