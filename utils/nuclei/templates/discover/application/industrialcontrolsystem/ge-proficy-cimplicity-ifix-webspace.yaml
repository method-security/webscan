id: ge-proficy-cimplicity-ifix-webspace-detect
info:
  name: GE Vernova / Proficy CIMPLICITY / iFIX / WebSpace Detection
  author: method-security
  severity: info
  description: Detects GE Vernova and GE Proficy CIMPLICITY, iFIX, and WebSpace web interfaces using GE/Proficy-specific web markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: GE_PROFICY_CIMPLICITY_IFIX_WEBSPACE
    cpe: cpe:2.3:a:ge:proficy_cimplicity:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,ge,ge-vernova,proficy,cimplicity,ifix,webspace
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/CimWeb/"
      - "{{BaseURL}}/ProficyWebSpace/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "proficy webspace") && (contains(tolower(body), "login") || contains(tolower(body), "launch") || contains(tolower(body), "<title") || contains(tolower(body), "/proficywebspace/"))'
          - 'contains(tolower(body), "proficy") && contains(tolower(body), "cimplicity") && (contains(tolower(body), "login") || contains(tolower(body), "cimweb") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "proficy") && contains(tolower(body), "ifix") && (contains(tolower(body), "login") || contains(tolower(body), "webspace") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "ge intelligent platforms") && (contains(tolower(body), "proficy") || contains(tolower(body), "cimplicity") || contains(tolower(body), "ifix")) && (contains(tolower(body), "login") || contains(tolower(body), "webspace") || contains(tolower(body), "cimweb"))'
          - 'contains(tolower(body), "ge vernova") && (contains(tolower(body), "proficy") || contains(tolower(body), "cimplicity") || contains(tolower(body), "ifix")) && (contains(tolower(body), "login") || contains(tolower(body), "webspace") || contains(tolower(body), "cimweb"))'
