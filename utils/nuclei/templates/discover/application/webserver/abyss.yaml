id: abyss-detect
info:
  name: Abyss Web Server Detection
  author: method-security
  severity: info
  description: Detects Abyss Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEBSERVER
    method-module-name: ABYSS
  tags: discovery,abyss,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/console/"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/docs/"
      - "{{BaseURL}}/manual/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: abyss"
          - "server: abyssws"
          - "x-powered-by: abyss"
          - "x-served-by: abyss"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "abyss console"
          - "abyss web server"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)abyss\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)abyss\\s+(x1|x2)\\s*[0-9]+\\.[0-9]+"
          - "(?i)aprelium\\s+abyss"
          - "(?i)abyss/x[0-9]+\\.[0-9]+"
          - "(?i)~abyssws/"
          - "(?i)abyss\\s+console"