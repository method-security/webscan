imports:
  http: ../common/http.yml
  method: ../common/method.yml
types:
  # Per-hop entry in the redirect history (URL + HTTP status code if known)
  RedirectHop:
    properties:
      url: string
      statusCode: optional<integer>
  # Enums
  SensitiveContentType:
    enum:
      - CREDENTIAL
      - PII_DATA
  SensitiveContentConfidenceLevel:
    enum:
      - HIGH
      - MEDIUM
      - LOW
  # Sensitive Content Structs
  SensitiveContentFingerprint:
    properties:
      name: string
      type: SensitiveContentType
      pattern: string
      confidence: SensitiveContentConfidenceLevel
  SensitiveContentFingerprints:
    properties:
      fingerprints: list<SensitiveContentFingerprint>
  SensitiveContent:
    properties:
      value: string
      fingerprint: SensitiveContentFingerprint
  # Function Config Struct
  DiscoverPageConfig:
    properties:
      target: string
      sensitiveContentDetection: boolean
      sensitiveContentFingerprintsPath: optional<string>
      responseCodes: string
      screenshot: boolean
      maxRedirects: integer
      verifyTls: boolean
      timeout: integer
      ignoreCrossDomainRedirects: boolean
      userAgent: method.UserAgentPreset
      requestMethod: method.RequestMethod
      headlessConfig: optional<method.HeadlessRequestConfig>
      browserbaseConfig: optional<method.BrowserbaseRequestConfig>
      headers: optional<map<string, string>>
      cookies: optional<map<string, string>>
      localStorage: optional<map<string, string>>
      sessionStorage: optional<map<string, string>>
  DiscoverPageResult:
    properties:
      request: optional<http.HttpRequestResponse>
      screenshot: optional<base64>
      sensitiveContents: optional<list<SensitiveContent>>
      finalUrl: optional<string>
      elapsedMs: optional<long>
      redirectHistory: optional<list<RedirectHop>>
  # Report Struct
  DiscoverPageReport:
    properties:
      config: DiscoverPageConfig
      result: DiscoverPageResult
      errors: optional<list<string>>
