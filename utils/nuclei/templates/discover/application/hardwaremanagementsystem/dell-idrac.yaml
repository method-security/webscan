id: dell-idrac-detect
info:
  name: Dell iDRAC Detection
  author: method-security
  severity: info
  description: Detects Dell iDRAC (Integrated Dell Remote Access Controller) web interfaces
  metadata:
    method-application-type: HARDWARE_MANAGEMENT_SYSTEM
    method-module-name: DELL_IDRAC
    cpe: cpe:2.3:a:dell:idrac:*:*:*:*:*:*:*:*
  tags: discovery,dell,idrac,bmc,remote-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/restgui/start.html"
      - "{{BaseURL}}/restgui/index.html"
      - "{{BaseURL}}/sysmgmt/2012/server/login"
      - "{{BaseURL}}/data/login"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "iDRAC"
          - "Integrated Dell Remote Access Controller"
          - "Dell Remote Access Controller"
          - "idracType"
          - "idrac-"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "iDRAC"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)iDRAC[0-9]+"
          - "(?i)dell\\s+(?:idrac|remote\\s+access)"
          - "(?i)<title>.*iDRAC.*</title>"
