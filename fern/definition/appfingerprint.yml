imports:
  common: ./common.yml
types:
  # AppFingerprintEnums
  ApiApplicationModule:
    enum:
      - FASTAPI
      - GRAPHQL
      - GRPC
      - SWAGGER
      - K8S
  CloudBucketModule:
    enum:
      - AWSS3
      - AZUREBLOB
  AppFingerprintResourceModule:
    union:
      ApiApplicationModule: ApiApplicationModule
      CloudBucketModule: CloudBucketModule
  AppFingerprintResourceType:
    enum:
      - APIAPPLICATION
      - CLOUDBUCKET
# AppFingerprint Config Struct
  AppFingerprintConfig:
    properties:
      targets: list<string>
      modules: list<AppFingerprintResourceModule>
      resourceType: AppFingerprintResourceType
      timeout: integer
      successfulOnly: boolean
# Request/Response Structs
  AppFingerprintResponseInfo:
    properties:
      statusCode: optional<integer>
      responseHeaders: optional<map<string, string>>
      responseBody: optional<string>
      errors: optional<list<string>>
  AppFingerprintRequestInfo:
    properties:
      baseUrl: string
      path: string
      method: common.HttpMethod
      bodyParams: optional<string>
# AppFingerprint Report Struct
  AppFingerprintAttemptInfo:
    properties:
      request: AppFingerprintRequestInfo
      response: optional<AppFingerprintResponseInfo>
      errors: optional<list<string>>
  AppFingerprintAttempt:
    properties:
      name: AppFingerprintResourceModule
      timestamp: datetime
      AttemptInfo: optional<list<AppFingerprintAttemptInfo>>
      finding : boolean
  AppFingerprintResourceInfo:
    properties:
      target: string
      attempts: list<AppFingerprintAttempt>
  AppFingerprintReport:
    properties:
      resourseType: AppFingerprintResourceType
      resourses: optional<list<AppFingerprintResourceInfo>>
      config: AppFingerprintConfig
      errors: optional<list<string>>