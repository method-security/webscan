id: kubernetes-enterprise-manager-detect
info:
  name: Exposed Kubernetes Enterprise Manager Application Detection
  author: method-security
  severity: info
  description: Detects exposed Kubernetes Enterprise Manager applications, dashboards, and management consoles that may provide administrative access to cluster resources
  metadata:
    method-application-type: KUBE
    method-module-name: KUBE
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  tags: discovery,kubernetes,k8s,dashboard,manager,enterprise,management-console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/dashboard"
      - "{{BaseURL}}/k8s/dashboard"
      - "{{BaseURL}}/ui"
      - "{{BaseURL}}/console"
      - "{{BaseURL}}/manager"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/cluster"
      - "{{BaseURL}}/workloads"
      - "{{BaseURL}}/namespaces"
      - "{{BaseURL}}/services"
      - "{{BaseURL}}/ingress"
      - "{{BaseURL}}/api/v1"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "\"app\":\"kubernetes-dashboard\"") || contains(tolower(body), "data-ng-app=\"kubernetesdashboard\"") || contains(tolower(body), "ng-app=\"kubernetesdashboard\"") || contains(tolower(body), "kubernetes-dashboard-head") || contains(tolower(header), "kubernetes-dashboard") || (contains(tolower(header), "x-rancher-version") && contains(tolower(body), "ember-basic-dropdown")) || (contains(tolower(header), "pl=rancher") && contains(tolower(body), "ember-basic-dropdown"))'
      - type: regex
        part: body
        regex:
          - '(?i)<title[^>]*>.*Kubernetes.*Dashboard.*</title>'
          - '(?i)<title[^>]*>.*K8s.*Manager.*</title>'