# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  requests: ../../common/requests.yml
  config: ../../common/config.yml
types:
  # Capture Route Config Struct
  CaptureRouteConfig:
    properties:
      target: string
      staticAssets: boolean
      baseURLsOnly: boolean
      maxRedirects: integer
      insecure: boolean
      timeout: integer
      requestMethod: config.RequestMethod
      headlessConfig: optional<config.HeadlessConfig>
      browserbaseConfig: optional<config.BrowserbaseConfig>
  # Signal Struct
  BodyParams:
    properties:
      name: string
      exampleValues: optional<list<string>>
  QueryParams:
    properties:
      name: string
      exampleValues: optional<list<string>>
  WebRoute:
    properties:
      url: string
      path: optional<string>
      method: optional<requests.HttpMethod>
      queryParams: optional<list<QueryParams>>
      bodyParams: optional<list<BodyParams>>
  CaptureRouteReport:
    properties:
      target: string
      routes: optional<list<WebRoute>>
      urls: optional<list<string>>
      errors: optional<list<string>>