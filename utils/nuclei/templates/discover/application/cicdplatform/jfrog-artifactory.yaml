id: jfrog-artifactory-detect
info:
  name: JFrog Artifactory Detection
  author: method-security
  severity: info
  description: Detects JFrog Artifactory installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: CI_CD_PLATFORM
    method-module-name: JFROG_ARTIFACTORY
  tags: discovery,jfrog,artifactory,artifact-repository,cicd
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/"
      - "{{BaseURL}}/artifactory/"
      - "{{BaseURL}}/artifactory/webapp/"
      - "{{BaseURL}}/artifactory/api/system/ping"
      - "{{BaseURL}}/artifactory/api/system/version"
      - "{{BaseURL}}/ui/login/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "x-artifactory-id"
          - "x-artifactory-node-id"
          - "server: artifactory"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "JFrog Artifactory"
          - "Artifactory"
          - "artifactory-version"
          - "artifactory-ui"
          - "jfrog-ui-essentials"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)<title>.*Artifactory.*</title>"
          - "(?i)artifactory\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)jfrog\\s+artifactory"
          - "(?i)\"version\":\\s*\"[0-9]+\\.[0-9]+\\.[0-9]+\""
