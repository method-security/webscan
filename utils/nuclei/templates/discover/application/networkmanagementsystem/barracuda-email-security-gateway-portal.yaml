id: barracuda-email-security-gateway-portal-detect
info:
  name: Barracuda Email Security Gateway Portal Detection
  author: method-security
  severity: info
  description: Detects Barracuda Email Security Gateway quarantine or spam portal pages.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: BARRACUDA_EMAIL_SECURITY_GATEWAY
    cpe: cpe:2.3:h:barracuda:email_security_gateway:*:*:*:*:*:*:*:*
  tags: discovery,barracuda,email,security,gateway,spam,firewall,portal
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cgi-bin/index.cgi"
      - "{{BaseURL}}/cgi-mod/index.cgi"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Barracuda"
          - "quarantine"
          - "spam"
        case-insensitive: true
        condition: and
