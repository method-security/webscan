id: vmware-vsphere-detect
info:
  name: VMware vSphere Detect
  author: method-security
  severity: info
  description: Detects VMware vSphere/vCenter Server installations
  metadata:
    method-application-type: HYPERVISOR
    method-module-name: VMWARE_VSPHERE
  tags: discovery,vmware,vsphere,vcenter,hypervisor
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/"
      - "{{BaseURL}}/folder"
      - "{{BaseURL}}/mob/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "VMware vCenter Server"
          - "vCenter Server"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "VMware vSphere"
          - "VMware vCenter Server"
          - "VMware VirtualCenter"
          - "vsphere-client"
          - "VMware vCenter"
          - "vCenter Server"
        case-insensitive: true