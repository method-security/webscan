id: drupal-detect
info:
  name: Drupal - Detect
  author: method-security
  severity: info
  description: Detects Drupal CMS installations by analyzing response headers and content patterns
  metadata:
    method-application-type: CONTENT_MANAGEMENT_SYSTEM
    method-module-name: DRUPAL
  tags: discovery,drupal,cms
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/CHANGELOG.txt"
      - "{{BaseURL}}/core/install.php"
      - "{{BaseURL}}/user/login"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Initial release"
          - "Drupal 1.0.0"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "content=\"Drupal"
          - "Welcome to Drupal"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "x-drupal"
          - "x-generator: drupal"
        case-insensitive: true