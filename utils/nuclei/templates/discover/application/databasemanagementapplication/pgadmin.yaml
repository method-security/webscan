id: pgadmin-detect
info:
  name: pgAdmin Detection
  author: method-security
  severity: info
  description: Detects pgAdmin 4 database administration interfaces using pgAdmin-specific login and static asset markers.
  metadata:
    method-application-type: DATABASE_MANAGEMENT_APPLICATION
    method-module-name: PGADMIN
    cpe: cpe:2.3:a:pgadmin:pgadmin:*:*:*:*:*:*:*:*
  tags: discovery,database,admin,pgadmin,postgresql
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/browser/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "pgadmin 4"
          - "csrf_token"
          - "email"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "pgadmin.browser"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "<title>pgadmin"
          - "/static/js"
        condition: and
        case-insensitive: true
