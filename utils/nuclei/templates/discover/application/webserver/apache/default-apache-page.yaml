id: default-apache-page-detect
info:
  name: Default Apache HTTP Server Page Detection
  author: method-security
  severity: info
  description: Detects the default Apache HTTP Server welcome page that indicates a default installation.
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: APACHE
    method-sub-module-name: DEFAULT_PAGE
    method-detection-state: DEFAULT_PAGE
    cpe:
      - cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  tags: discovery,apache,httpd,default-page,misconfiguration
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "If you can see this, it means the installation of the Apache web server software"
          - "It works!"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "Apache2 Debian Default Page"
          - "Apache2 Ubuntu Default Page"
          - "Apache HTTP Server Test Page"
      - type: word
        part: body
        words:
          - "This page is used to test the proper operation of the Apache HTTP server."
        case-insensitive: true
