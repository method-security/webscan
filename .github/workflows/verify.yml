name: 🙏🏻 Verify

on:
  workflow_call:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Fern Generated Code (Go)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: fern-generated-code
          path: generated/

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Verify embedded scan asset archives
        run: |
          go generate ./configs
          for archive in configs/embedded/configs.tar.gz utils/nuclei/templates/embedded/templates.tar.gz; do
            if ! git ls-files --error-unmatch "$archive" >/dev/null 2>&1; then
              echo "$archive is not checked in."
              exit 1
            fi
            if [ ! -s "$archive" ]; then
              echo "$archive was not generated."
              exit 1
            fi
          done
          if ! git diff --exit-code -- configs/embedded/configs.tar.gz utils/nuclei/templates/embedded/templates.tar.gz; then
            echo "Embedded scan asset archives are stale. Run go generate ./configs and commit the updated archives."
            exit 1
          fi
        env:
          GOCACHE: ${{ runner.temp }}/go-build

      - name: Godel Verify
        run: ./godelw verify
