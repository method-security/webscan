id: vmware-cloud-director-detect
info:
  name: VMware Cloud Director Detection
  author: method-security
  severity: info
  description: Detects VMware Cloud Director provider and tenant portals using VCD-specific UI and API markers.
  metadata:
    method-application-type: CLOUD_CONSOLE
    method-module-name: VMWARE_CLOUD_DIRECTOR
    cpe: cpe:2.3:a:vmware:cloud_director:*:*:*:*:*:*:*:*
  tags: discovery,vmware,vcloud,cloud-director,cloud,console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/tenant/"
      - "{{BaseURL}}/provider/"
      - "{{BaseURL}}/cloud/org/"
      - "{{BaseURL}}/api/versions"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(header), "x-vmware-vcloud-request-id") && contains(tolower(body), "vcloud") && (contains(tolower(body), "tenant") || contains(tolower(body), "provider"))'
          - 'status_code == 200 && contains(tolower(body), "vmware cloud director")'
          - 'status_code == 200 && contains(tolower(body), "vcloud director") && (contains(tolower(body), "tenant") || contains(tolower(body), "provider"))'
          - 'status_code == 200 && contains(tolower(body), "vcloud") && contains(tolower(body), "api/versions") && contains(tolower(body), "vmware")'
