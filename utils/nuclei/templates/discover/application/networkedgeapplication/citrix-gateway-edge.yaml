id: citrix-gateway-edge-detect
info:
  name: Citrix NetScaler Gateway Detection
  author: method-security
  severity: info
  description: Detects Citrix Gateway and NetScaler Gateway edge access portals using Citrix-specific VPN paths, branded pages, and NSC cookies.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: CITRIX_GATEWAY
    method-sub-module-name: SSL_VPN_PORTAL
    method-detection-state: DETECTED
    cpe: cpe:2.3:a:citrix:gateway:*:*:*:*:*:*:*:*
  tags: discovery,vpn,citrix,netscaler,gateway,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/vpn/index.html"
      - "{{BaseURL}}/vpns/"
      - "{{BaseURL}}/logon/LogonPoint/index.html"
      - "{{BaseURL}}/xenapp/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Citrix Gateway"
          - "NetScaler Gateway"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "nsgateway"
          - "citrix"
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - "NSC_"
        case-insensitive: true
      - type: dsl
        dsl:
          - 'contains(tolower(all_headers), "ns_af") && contains(tolower(body), "citrix")'
      - type: word
        part: body
        words:
          - "<title>Citrix Gateway</title>"
          - "<title>NetScaler Gateway</title>"
          - "<title>Citrix Virtual Apps</title>"
        case-insensitive: true
