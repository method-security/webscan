id: microsoft-iis-version
info:
  name: Microsoft IIS version detect
  author: method-security
  severity: info
  description: Detects Microsoft IIS web servers by analyzing response headers
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: IIS
    cpe: cpe:2.3:a:microsoft:internet_information_services:*:*:*:*:*:*:*:*
  tags: discovery,microsoft,iis,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)server:\\s*microsoft-iis"
          - "(?i)server:\\s*iis/[\\d.]+"
          - "(?i)x-powered-by:\\s*asp\\.net"
          - "(?i)x-aspnet-version:"
      - type: regex
        part: body
        regex:
          - "(?i)iis/[\\d.]+"
          - "(?i)microsoft\\s+internet\\s+information\\s+services"
          - "(?i)iis\\s+detailed\\s+error"