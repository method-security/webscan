id: ubiquiti-airos-detect
info:
  name: Ubiquiti airOS Wireless Radio Web Management Detection
  author: method-security
  severity: info
  description: |
    Detects Ubiquiti airOS wireless-radio management interfaces (NanoStation, LiteBeam, PowerBeam, Bullet, Rocket families).
    The smoking-gun signal is the Set-Cookie: AIROS_<MAC>= response cookie — the 12-hex suffix is the device MAC,
    making MAC + OUI lookup a two-source vendor confirmation.
    Validated against TC-004 (AirOS device, lighttpd/1.4.39, build 160526.1224).
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: UBIQUITI_AIROS
    method-detection-state: EXPOSED_ADMIN
    cpe: cpe:2.3:o:ubiquiti:airos:*:*:*:*:*:*:*:*
  tags: discovery,ubiquiti,airos,wireless,radio,network-management,soho
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    matchers-condition: and
    matchers:
      # Smoking gun #1: AIROS_<12-hex>= cookie. The hex suffix is the
      # device MAC, encoded in the cookie name. Ubiquiti's stock airOS
      # always sets this cookie — distinct from UniFi controller, EdgeOS,
      # and every other Ubiquiti product line.
      - type: regex
        part: header
        regex:
          - '(?i)set-cookie:\s*AIROS_[0-9A-F]{12}='
      # Co-signal: lighttpd Server header. Ubiquiti does NOT strip
      # the Server header (distinct from MikroTik, Dahua, modern
      # Hikvision). lighttpd/1.4.39 is the AirOS 5.x build; we
      # accept any 1.4.x to cover firmware drift.
      - type: regex
        part: header
        regex:
          - '(?i)server:\s*lighttpd/1\.4\.[0-9]+'
    extractors:
      # Extract the MAC from the AIROS_<MAC>= cookie. Surfaced via
      # the extractor field for downstream correlation; the dedicated
      # ApplicationFingerprintAttempt.deviceMac wiring + OUI lookup
      # land with the SEC-702.A schema work (PR #423) and are picked
      # up in a follow-on PR once that merges.
      - type: regex
        name: device_mac
        part: header
        group: 1
        regex:
          - '(?i)set-cookie:\s*AIROS_([0-9A-F]{12})='
      # Server header (capture full version for downstream correlation
      # with AirOS firmware branches).
      - type: regex
        name: server
        part: header
        group: 1
        regex:
          - '(?i)server:\s*(lighttpd/1\.4\.[0-9]+)'
