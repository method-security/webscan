id: f5-bigip-detect
info:
  name: F5 BIG-IP TMUI Management Console Detection
  author: method-security
  severity: info
  description: Detects F5 BIG-IP Configuration Utility web management interfaces by identifying login pages and management-specific endpoints (not load balancer infrastructure).
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: F5_BIGIP
    method-sub-module-name: MANAGEMENT_CONSOLE
  tags: discovery,f5,bigip,load-balancer,adc,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/tmui/login.jsp"
      - "{{BaseURL}}/tmui/tmui/login/welcome.jsp"
      - "{{BaseURL}}/xui/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<meta[^>]+name=["'']description["''][^>]+content=["'']BIG-IP(?:&reg;|®)?\s+Configuration\s+Utility["'']'
          - '(?i)F5\s*BIG-IP\s*(Configuration\s*Utility|Management\s*Console)'
          - '(?i)BIG-IP.*Configuration\s*Utility.*Login'
      - type: word
        part: body
        words:
          - "BIG-IP"
          - "tmui/login"
        case-insensitive: true
        condition: and
      - type: word
        part: body
        words:
          - "F5_LOGON_PAGE"
          - "/tmui/"
        case-insensitive: true
        condition: and
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "big-ip") && contains(tolower(body), "configuration utility") && (contains(tolower(body), "tmui/login") || contains(tolower(body), "/xui/common/"))'
