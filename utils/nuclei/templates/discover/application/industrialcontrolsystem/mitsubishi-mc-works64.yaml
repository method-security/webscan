id: mitsubishi-mc-works64-detect
info:
  name: Mitsubishi Electric MC Works64 Detection
  author: method-security
  severity: info
  description: Detects Mitsubishi Electric MC Works64 web interfaces using MC Works64-specific login/title markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: MITSUBISHI_MC_WORKS64
    cpe: cpe:2.3:a:mitsubishielectric:mc_works64:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,mitsubishi,mc-works64,iconics
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/MCWorks64/"
      - "{{BaseURL}}/MCWorks64/Login.aspx"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "mitsubishi electric") && contains(tolower(body), "mc works64") && (contains(tolower(body), "login") || contains(tolower(body), "<title>mc works64") || contains(tolower(body), "<title>mitsubishi electric mc works64"))'
