id: google-cloud-console-detect
info:
  name: Google Cloud Console Detection
  author: method-security
  severity: info
  description: Detects Google Cloud Console surfaces using Google Cloud console-specific shell and sign-in markers.
  metadata:
    method-application-type: CLOUD_CONSOLE
    method-module-name: GOOGLE_CLOUD_CONSOLE
    cpe: cpe:2.3:a:google:cloud_console:*:*:*:*:*:*:*:*
  tags: discovery,google,gcp,cloud,console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/home/dashboard"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "google cloud console")'
          - 'status_code == 200 && contains(tolower(body), "console.cloud.google.com") && contains(tolower(body), "google cloud")'
          - 'status_code == 200 && contains(tolower(body), "cloud console") && contains(tolower(body), "googleapis.com") && contains(tolower(body), "gstatic.com")'
