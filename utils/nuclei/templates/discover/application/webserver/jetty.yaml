id: jetty-detect
info:
  name: Jetty Web Server Detection
  author: method-security
  severity: info
  description: Detects Jetty Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: JETTY
  tags: discovery,jetty,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/stats"
      - "{{BaseURL}}/dump"
      - "{{BaseURL}}/jmx"
      - "{{BaseURL}}/jolokia/"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/status/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: jetty"
          - "x-powered-by: jetty"
          - "x-served-by: jetty"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)jetty\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)jetty\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)jetty\\s+server\\s+[0-9]+\\.[0-9]+"
          - "(?i)eclipse\\s+jetty\\s*[0-9]+\\.[0-9]+"
          - "(?i)powered\\s+by\\s+jetty"
          - "(?i)mortbay\\s+jetty"