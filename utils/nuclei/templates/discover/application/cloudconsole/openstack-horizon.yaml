id: openstack-horizon-detect
info:
  name: OpenStack Horizon Dashboard Detection
  author: method-security
  severity: info
  description: Detects OpenStack Horizon cloud dashboards using Horizon-specific login paths, titles, and static assets.
  metadata:
    method-application-type: CLOUD_CONSOLE
    method-module-name: OPENSTACK_HORIZON
    cpe: cpe:2.3:a:openstack:horizon:*:*:*:*:*:*:*:*
  tags: discovery,openstack,horizon,cloud,console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/dashboard/auth/login/"
      - "{{BaseURL}}/auth/login/"
      - "{{BaseURL}}/horizon/auth/login/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "openstack dashboard") && contains(tolower(body), "horizon")'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "login") && contains(tolower(body), "static/dashboard/") && contains(tolower(body), "openstack")'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "horizon") && contains(tolower(body), "csrfmiddlewaretoken") && contains(tolower(body), "region")'
