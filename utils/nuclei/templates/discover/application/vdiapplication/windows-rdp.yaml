id: windows-rdp-detect
info:
  name: Windows RDP Gateway Detection
  author: method-security
  severity: info
  description: Detects Windows RDP Gateway and Remote Desktop Web Access installations
  metadata:
    method-application-type: VDI_APPLICATION
    method-module-name: WINDOWS_RDP
    cpe: cpe:2.3:a:microsoft:remote_desktop_gateway:*:*:*:*:*:*:*:*
  tags: discovery,microsoft,rdp,vdi
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/RemoteDesktop/"
      - "{{BaseURL}}/rpc/rpcproxy.dll"
      - "{{BaseURL}}/ts/"
      - "{{BaseURL}}/tsweb/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "X-RDWeb"
          - "X-Ms-Rdsh-Auth"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)RDWeb.*login\\.aspx"