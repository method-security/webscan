imports:
  requests: ../../../common/requests.yml
types:
  AppEnumerateIISConfig:
    properties:
      targets: list<string>
      timeout: integer
      threads: optional<integer>
  ServerInfo:
    properties:
      name: string
      version: optional<string>
  FrameworkInfo:
    properties:
      name: string
      version: optional<string>
  IISSite:
    properties:
      server: ServerInfo
      frameworks: optional<list<FrameworkInfo>>
      authenticationMethods: optional<list<string>> # WWW-Authenticate headers
      defaultDocuments: optional<list<string>>
      customErrors: optional<boolean>
  AppEnumerateIISTargetInfo:
    properties:
      target: string
      sites: optional<list<IISSite>>
      requests: optional<list<requests.RequestInfo>>
  AppEnumerateIISReport:
    properties:
      targets: optional<list<AppEnumerateIISTargetInfo>>
      config: AppEnumerateIISConfig
      errors: optional<list<string>>