id: vmware-esxi-detect
info:
  name: VMware ESXi Detection
  author: method-security
  severity: info
  description: Detects VMware ESXi web interfaces (including UI and MOB endpoints).
  classification:
    cpe: cpe:2.3:o:vmware:esxi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: vmware
    product: esxi
    category: hypervisor
    method-application-type: HYPERVISOR
    method-module-name: VMWARE_ESXI
  tags:
    - tech
    - vmware
    - esxi
    - hypervisor
    - virtualization
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/"
      - "{{BaseURL}}/mob/"
      - "{{BaseURL}}/folder"
      - "{{BaseURL}}/folder?dcPath=ha-datacenter"
    redirects: true
    max-redirects: 3
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "VMware ESXi"
          - "ESXi Embedded Host Client"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "VMware ESXi"
          - "Server: VMware"
        case-insensitive: true
