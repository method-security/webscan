id: rockwell-factorytalk-viewpoint-detect
info:
  name: Rockwell FactoryTalk ViewPoint Detection
  author: method-security
  severity: info
  description: Detects Rockwell Automation FactoryTalk ViewPoint web interfaces.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: ROCKWELL_FACTORYTALK_VIEWPOINT
    cpe: cpe:2.3:a:rockwellautomation:factorytalk_viewpoint:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,rockwell,factorytalk,viewpoint
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/FTViewPoint/"
      - "{{BaseURL}}/ViewPoint/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>FTVP"
          - "ViewPoint.aspx"
        condition: and
        case-insensitive: true
