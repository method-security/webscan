id: openresty-detect
info:
  name: OpenResty Web Server Detection
  author: method-security
  severity: info
  description: Detects OpenResty Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: OPENRESTY
  tags: discovery,openresty,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/nginx_status"
      - "{{BaseURL}}/status"
      - "{{BaseURL}}/luarocks/"
      - "{{BaseURL}}/lualib/"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: openresty"
          - "x-powered-by: openresty"
          - "x-served-by: openresty"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)openresty\\s*[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)openresty\\s+web\\s+platform"
          - "(?i)nginx[\\s/-]+openresty"
          - "(?i)lua[\\s_-]+resty"
          - "(?i)ngx_lua\\s*[0-9]+\\.[0-9]+"
          - "(?i)luajit\\s*[0-9]+\\.[0-9]+"