id: microsoft-sharepoint-detect
info:
  name: Microsoft SharePoint Detection
  author: method-security
  severity: info
  description: Detects Microsoft SharePoint sites using SharePoint-specific headers, _layouts paths, and page generator markers.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: MICROSOFT_SHAREPOINT
    cpe: cpe:2.3:a:microsoft:sharepoint_server:*:*:*:*:*:*:*:*
  tags: discovery,microsoft,sharepoint,collaboration
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/_layouts/15/start.aspx"
      - "{{BaseURL}}/_layouts/15/viewlsts.aspx"
      - "{{BaseURL}}/_layouts/15/Authenticate.aspx"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "microsoftsharepointteamservices"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "sharepoint"
          - "/_layouts/15/"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "msapplication-tileimage"
          - "sharepoint"
        condition: and
        case-insensitive: true
