id: discover-fortinet-fortigate-http09-banner

info:
  name: Discover FortiGate HTTP/0.9 / Banner Disclosure
  author: method-security
  severity: info
  description: Detects Fortinet FortiGate devices responding over HTTP/0.9 or plaintext.
  metadata:
    method-application-type: FIREWALL
    method-module-name: FORTINET_FORTIGATE
  tags: fortinet, fortigate, network, banner, http0.9
tcp:
  - host:
      - "{{Hostname}}"
    inputs:
      - data: "GET /\r\n"
    matchers:
      - type: regex
        part: data
        # Matches Fortinet banners. On HTTP/0.9 responses, these are very likely FortiGate firewalls,
        # though other Fortinet products may occasionally use similar identifiers.
        regex:
          - '(?i)fortinet'
          - '(?i)fortigate'
