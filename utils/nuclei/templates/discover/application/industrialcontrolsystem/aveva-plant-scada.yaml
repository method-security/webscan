id: aveva-plant-scada-detect
info:
  name: AVEVA Plant SCADA Detection
  author: method-security
  severity: info
  description: Detects AVEVA Plant SCADA web interfaces using an AVEVA Plant SCADA title marker.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: AVEVA_PLANT_SCADA
    cpe: cpe:2.3:a:aveva:plant_scada:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,aveva,plant-scada
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/PlantSCADA/"
      - "{{BaseURL}}/Runtime/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>AVEVA Plant SCADA"
        case-insensitive: true
