id: ge-proficy-webspace-detect
info:
  name: GE Proficy WebSpace Detection
  author: method-security
  severity: info
  description: Detects GE Proficy WebSpace web interfaces using Proficy WebSpace path and vendor markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: GE_PROFICY_WEBSPACE
    cpe: cpe:2.3:a:ge:proficy_webspace:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,ge,proficy,webspace
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ProficyWebSpace/"
      - "{{BaseURL}}/proficywebspace"
      - "{{BaseURL}}/WebSpace/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>Proficy WebSpace"
        case-insensitive: true
      - type: word
        part: all
        words:
          - "proficywebspace"
        case-insensitive: true
