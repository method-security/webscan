id: opentext-content-server-detect
info:
  name: OpenText Content Server Detection
  author: method-security
  severity: info
  description: Detects OpenText Content Server collaboration portals using cs.exe paths, OpenText branding, and Content Server-specific cookies.
  metadata:
    method-application-type: COLLABORATION_APPLICATION
    method-module-name: OPENTEXT_CONTENT_SERVER
    cpe: cpe:2.3:a:opentext:content_server:*:*:*:*:*:*:*:*
  tags: discovery,opentext,content-server,collaboration
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/otcs/cs.exe"
      - "{{BaseURL}}/cs/cs.exe"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "opentext"
          - "content server"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "llcookie"
          - "content server"
        condition: and
        case-insensitive: true
      - type: word
        part: all
        words:
          - "llcookie"
          - "opentext"
        condition: and
        case-insensitive: true
