id: juniper-jweb-detect
info:
  name: Juniper J-Web Management Detection
  author: method-security
  severity: info
  description: Detects Juniper J-Web network device management interfaces using Junos/J-Web-specific login markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: JUNIPER_JWEB
    cpe: cpe:2.3:a:juniper:j-web:*:*:*:*:*:*:*:*
  tags: discovery,juniper,junos,jweb,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/jsdm/"
      - "{{BaseURL}}/ui/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "j-web") && contains(tolower(body), "juniper")'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "junos") && contains(tolower(body), "jweb")'
          - 'status_code == 200 && !contains(tolower(body), "gitlab community edition") && contains(tolower(body), "juniper networks") && contains(tolower(body), "jsdm")'
