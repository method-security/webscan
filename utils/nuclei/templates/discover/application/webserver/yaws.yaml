id: yaws-detect
info:
  name: Yaws Web Server Detection
  author: method-security
  severity: info
  description: Detects Yaws Web Server installations by analyzing response headers, body content, and common paths
  metadata:
    method-application-type: WEB_SERVER
    method-module-name: YAWS
    cpe: cpe:2.3:a:yaws:yaws:*:*:*:*:*:*:*:*
  tags: discovery,yaws,webserver
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/stats"
      - "{{BaseURL}}/status"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/doc/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "server: yaws"
          - "x-powered-by: yaws"
          - "x-served-by: yaws"
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - "(?i)yaws\\s+web\\s+server\\s+[0-9]+\\.[0-9]+\\.[0-9]+"
          - "(?i)yet\\s+another\\s+web\\s+server"
          - "(?i)powered\\s+by\\s+yaws"
          - "(?i)erlang[\\s/-]+yaws"