imports:
  common: ./common.yml
types:
  # Config Struct
  FuzzPathConfig:
    properties:
      targets: list<string>
      paths: list<string>
      responseCodes: string
      ignoreBaseContent: boolean
      timeout: integer
      sleep: integer
      retries: integer
      successfulOnly: boolean
# Request/Response Structs
  ResponseInfo:
    properties:
      statusCode: optional<integer>
      body: optional<string>
      error: optional<string>
  RequestInfo:
    properties:
      method: common.HttpMethod
      url: string
  FuzzAttemptInfo:
    properties:
      path: string
      timestamp: datetime
      request: RequestInfo
      response: optional<ResponseInfo>
      finding: optional<boolean>
  TargetInfo:
    properties:
      target: string
      fuzzAttempts: list<FuzzAttemptInfo>
  FuzzPathReport:
    properties:
      targets: optional<list<TargetInfo>>
      errors: optional<list<string>>