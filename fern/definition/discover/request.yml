imports:
  http: ../common/http.yml
  method: ../common/method.yml

types:
  TlsCertificate:
    properties:
      subject: string
      issuer: string
      sans: optional<list<string>>
      notBefore: datetime
      notAfter: datetime
      serialNumber: optional<string>

  RequestFile:
    docs: A single multipart file part for an upload request.
    properties:
      fieldName: string
      fileName: string
      contentBase64: string
      contentType: optional<string>

  DiscoverRequestConfig:
    properties:
      target: string
      httpMethod: http.HttpMethod
      headers: optional<map<string, string>>
      jsonBody: optional<string>
      textBody: optional<string>
      formData: optional<map<string, string>>
      files: optional<list<RequestFile>>
      binaryBody: optional<string>
      binaryBodyMimeType: optional<string>
      maxRedirects: integer
      followRedirects: boolean
      verifyTls: boolean
      timeout: integer
      userAgent: method.UserAgentPreset
      ignoreCrossDomainRedirects: boolean

  DiscoverRequestResult:
    properties:
      request: optional<http.HttpRequestResponse>
      tlsCertificates: optional<list<TlsCertificate>>

  DiscoverRequestReport:
    properties:
      config: DiscoverRequestConfig
      result: DiscoverRequestResult
      errors: optional<list<string>>
