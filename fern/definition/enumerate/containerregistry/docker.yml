imports:
  http: ../../common/http.yml
types:
  # Config Struct
  EnumerateDockerConfig:
    properties:
      targets: list<string>
      verifyTls: boolean
      timeout: integer
      sleep: integer
      jitter: integer
      threads: integer
  # Docker Registry V2 API Response Objects
  DockerManifestDescriptor:
    properties:
      size: optional<integer>
  DockerManifestV2:
    properties:
      config: optional<DockerManifestDescriptor>
      layers: optional<list<DockerManifestDescriptor>>
  DockerCatalogResponse:
    properties:
      repositories: optional<list<string>>
  DockerTagsResponse:
    properties:
      name: optional<string>
      tags: optional<list<string>>
  # Container Registry Objects
  ContainerImage:
    properties:
      digest: string
      tags: optional<list<string>>
      size: optional<integer>
      manifest: optional<string>
  ContainerRepository:
    properties:
      name: string
      images: optional<list<ContainerImage>>
  # Result Struct
  EnumerateDockerResult:
    properties:
      target: string
      catalogRequest: http.HttpRequestResponse
      repositories: optional<list<ContainerRepository>>
      success: boolean
  EnumerateDockerResults:
    properties:
      targets: optional<list<EnumerateDockerResult>>
  # Report Struct
  EnumerateDockerReport:
    properties:
      config: EnumerateDockerConfig
      result: EnumerateDockerResults
      errors: optional<list<string>>
