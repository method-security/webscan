id: fortinet-fortigate-sslvpn-detect
info:
  name: Fortinet FortiGate SSL-VPN Portal Detection
  author: method-security
  severity: info
  description: Detects Fortinet FortiGate SSL-VPN portals using FortiGate remote login paths and Fortinet-specific language and cookie markers.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: FORTINET_FORTIGATE_SSLVPN
    method-sub-module-name: SSL_VPN_PORTAL
    method-detection-state: DETECTED
    cpe: cpe:2.3:o:fortinet:fortios:*:*:*:*:*:*:*:*
  tags: discovery,vpn,fortinet,fortigate,fortios,ssl-vpn,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/remote/login"
      - "{{BaseURL}}/remote/fgt_lang"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "FortiGate SSL-VPN"
          - "FortiGate SSL VPN"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "fortinet"
          - "remote/login"
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - "SVPNCOOKIE="
        case-insensitive: true
      - type: word
        part: body
        words:
          - "<title>FortiGate</title>"
          - "<title>Fortinet</title>"
        case-insensitive: true
