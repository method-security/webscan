id: siemens-simatic-wincc-pcs7-detect
info:
  name: Siemens SIMATIC WinCC / PCS 7 Web Detection
  author: method-security
  severity: info
  description: Detects Siemens SIMATIC WinCC, WinCC Unified, PCS 7, and HMI web features using Siemens and WinCC-specific web markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: SIEMENS_SIMATIC_WINCC_PCS7
    cpe: cpe:2.3:a:siemens:simatic_wincc:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,siemens,simatic,wincc,pcs7,hmi
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Portal/Portal.mwsl"
      - "{{BaseURL}}/Runtime/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "siemens") && contains(tolower(body), "simatic wincc") && (contains(tolower(body), "login") || contains(tolower(body), "/portal/portal.mwsl") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "siemens") && contains(tolower(body), "wincc unified") && (contains(tolower(body), "login") || contains(tolower(body), "runtime") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "siemens") && contains(tolower(body), "pcs 7") && contains(tolower(body), "web") && (contains(tolower(body), "login") || contains(tolower(body), "runtime") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "simatic hmi") && contains(tolower(body), "siemens") && (contains(tolower(body), "login") || contains(tolower(body), "runtime") || contains(tolower(body), "<title"))'
          - 'contains(tolower(body), "/portal/portal.mwsl") && contains(tolower(body), "wincc") && contains(tolower(body), "siemens")'
