default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-go-sdk
        version: 0.38.0
        config:
          importpath: github.com/Method-Security/webscan/generated/go
        output:
          location: local-file-system
          path: ../generated/go
        smart-casing: false
  pypi-local:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.1
        output:
          location: local-file-system
          path: ../generated/python
        smart-casing: false
  pypi-test:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.1
        config:
          package_name: methodwebscan
        output:
          location: pypi
          package-name: methodwebscan
          token: ${TEST_PYPI_TOKEN}
          url: https://test.pypi.org/legacy/
        smart-casing: false
  pypi:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.1
        config:
          package_name: methodwebscan
        output:
          location: pypi
          package-name: methodwebscan
          token: ${PYPI_TOKEN}
        smart-casing: false
