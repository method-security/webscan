id: codesys-webvisu-detect
info:
  name: CODESYS WebVisu Detection
  author: method-security
  severity: info
  description: Detects CODESYS WebVisu web visualization interfaces using CODESYS and WebVisu-specific page markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: CODESYS_WEBVISU
    cpe: cpe:2.3:a:codesys:codesys_webvisu:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,plc,codesys,webvisu
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/webvisu.htm"
      - "{{BaseURL}}/WebVisu.htm"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "CODESYS WebVisu"
          - "3S-Smart Software Solutions"
        condition: and
        case-insensitive: true
