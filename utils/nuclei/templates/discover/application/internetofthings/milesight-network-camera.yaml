id: milesight-network-camera-detect
info:
  name: Milesight Network Camera Detection
  author: method-security
  severity: info
  description: Detects Milesight network camera web interfaces using the Milesight camera title and login asset markers.
  metadata:
    method-application-type: INTERNET_OF_THINGS
    method-module-name: MILESIGHT_NETWORK_CAMERA
    cpe: cpe:2.3:h:milesight:*:*:*:*:*:*:*:*:*
  tags: discovery,iot,camera,milesight
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/login.asp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>Milesight Network Camera</title>"
          - "X-UA-Compatible"
        condition: and
        case-insensitive: true
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*Milesight\s+Network\s+Camera\s*</title>'
