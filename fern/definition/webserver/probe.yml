types:
  # Config Struct
  WebserverProbeStrategy:
    enum:
      - REQUEST
      - BROWSER
  WebserverProbeConfig:
    properties:
      targets: list<string>
      timeout: integer
      strategy: WebserverProbeStrategy
      browserPath: optional<string>
      minDOMStabalizeTime: optional<integer>
  # WebserverProbeUrl Struct
  WebserverProbeUrlDetails:
    properties:
      url: string 
      status: optional<integer>
      title: optional<string>
  WebserverProbeReport:
    properties:
      targets: list<string>
      urls: optional<list<WebserverProbeUrlDetails>>
      errors: optional<list<string>>
