imports:
  http: ../../common/http.yml
types:
  # Function Config Struct
  EnumerateKubeConfig:
    properties:
      target: string
      verifyTls: boolean
      timeout: integer
      sleep: integer
      jitter: integer
  EnumerateKubeResult:
    properties:
      target: string
      requests: optional<list<http.HttpRequestResponse>>
  # Report Struct
  EnumerateKubeReport:
    properties:
      config: EnumerateKubeConfig
      result: EnumerateKubeResult
      errors: optional<list<string>>
