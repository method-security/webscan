imports:
  requests: ../common/requests.yml
# Enums
types:
# Config Struct
  WebserverHeadergrabConfig:
    properties:
      targets: list<string>
      timeout: integer
  # WebserverHeadergrab Struct
  WebserverHeadergrabAttemptInfo:
    properties:
      target: string
      request: requests.RequestInfo
  WebserverHeadergrabReport:
    properties:
      targets: list<WebserverHeadergrabAttemptInfo>
      config: WebserverHeadergrabConfig
      errors: optional<list<string>>


