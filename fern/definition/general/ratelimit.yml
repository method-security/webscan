imports:
  requests: ../common/requests.yml
types:
  # Config Struct
  GeneralRateLimitConfig:
    properties:
      targets: list<string>
      maxRequests: integer
      timespan: integer
      timeout: integer
  # GeneralRateLimit Struct
  GeneralRateLimitAttemptInfo:
    properties:
      requestNumber: integer
      request: requests.RequestInfo
  GeneralRateLimitTargetInfo:
    properties:
      target: string
      startTimestamp: datetime
      endTimestamp: datetime
      detectedRequest: optional<GeneralRateLimitAttemptInfo>
  GeneralRateLimitReport:
    properties:
      targets: optional<list<GeneralRateLimitTargetInfo>>
      config: GeneralRateLimitConfig
      errors: optional<list<string>>
