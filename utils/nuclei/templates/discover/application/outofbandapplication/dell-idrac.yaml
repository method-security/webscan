id: dell-idrac-detect
info:
  name: Dell iDRAC Detection
  author: method-security
  severity: info
  description: High-accuracy detection of Dell iDRAC (Integrated Dell Remote Access Controller) management interfaces
  metadata:
    method-application-type: OUT_OF_BAND_APPLICATION
    method-module-name: DELL_IDRAC
    cpe: cpe:2.3:a:dell:idrac:*:*:*:*:*:*:*:*
  tags: discovery,dell,idrac,bmc,redfish,out-of-band,remote-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.html"
      - "{{BaseURL}}/sysmgmt/2012/server/login"
      - "{{BaseURL}}/restgui/start.html"
      - "{{BaseURL}}/data/login"
      - "{{BaseURL}}/redfish/v1/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        name: idrac-title
        part: body
        regex:
          - "(?i)<title>.*iDRAC.*</title>"
      - type: word
        name: idrac-headers
        part: header
        words:
          - "Set-Cookie: idrac"
          - "Server: iDRAC"
        case-insensitive: true
      - type: regex
        name: idrac-json-api
        part: body
        regex:
          - "(?i)\"idrac[^\"]+\":\"[0-9A-Za-z._-]+\""
      - type: word
        part: body
        words:
          - "integrated dell remote access controller"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "idrac"
          - "redfish"
          - "dell"
        condition: and
        case-insensitive: true
