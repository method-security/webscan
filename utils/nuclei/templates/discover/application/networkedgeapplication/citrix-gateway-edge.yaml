id: citrix-gateway-edge-detect
info:
  name: Citrix NetScaler Gateway Detection
  author: method-security
  severity: info
  description: Detects Citrix Gateway and NetScaler Gateway edge access portals using Citrix-specific VPN paths, branded pages, and NSC cookies.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: CITRIX_GATEWAY
    cpe: cpe:2.3:a:citrix:gateway:*:*:*:*:*:*:*:*
  tags: discovery,citrix,netscaler,gateway,vpn,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/vpn/index.html"
      - "{{BaseURL}}/vpns/"
      - "{{BaseURL}}/logon/LogonPoint/index.html"
      - "{{BaseURL}}/xenapp/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "citrix gateway") || contains(tolower(body), "netscaler gateway")'
          - 'contains(tolower(body), "nsgateway") && contains(tolower(body), "citrix")'
          - 'contains(tolower(header), "ns_af") && contains(tolower(body), "citrix")'
