id: siemens-wincc-unified-detect
info:
  name: Siemens WinCC Unified Detection
  author: method-security
  severity: info
  description: Detects Siemens WinCC Unified web interfaces using a WinCC Unified title marker.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: SIEMENS_WINCC_UNIFIED
    cpe: cpe:2.3:a:siemens:wincc_unified:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,siemens,wincc-unified,hmi
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Runtime/"
      - "{{BaseURL}}/WinCCUnified/"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Siemens"
          - "<title>WinCC Unified"
        condition: and
        case-insensitive: true
