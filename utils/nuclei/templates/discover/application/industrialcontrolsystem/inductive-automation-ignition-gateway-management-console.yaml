id: inductive-automation-ignition-gateway-detect
info:
  name: Inductive Automation Ignition Gateway Management Console Detection
  author: method-security
  severity: info
  description: Detects Inductive Automation Ignition Gateway web consoles using Ignition Gateway and Inductive Automation-specific web markers.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: INDUCTIVE_AUTOMATION_IGNITION_GATEWAY
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:a:inductiveautomation:ignition:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,inductive-automation,ignition,gateway,scada
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/web/home"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "<title>Ignition Gateway"
          - "Inductive Automation"
        condition: and
        case-insensitive: true
