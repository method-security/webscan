id: inductive-automation-ignition-gateway-detect
info:
  name: Inductive Automation Ignition Gateway Detection
  author: method-security
  severity: info
  description: |
    Detects Inductive Automation Ignition Gateway web consoles. Default
    ports are 8088 (HTTP) and 8043 (HTTPS) but bare instances also expose
    on 80/443 when fronted. High-confidence markers: the bare
    "Ignition Gateway" title, the perspective client.js asset path, the
    Cache-Control: no-store header, and the ContextStatus / GatewayAddress
    / PlatformName=Ignition token triple from the gwinfo endpoint.
  metadata:
    method-application-type: INDUSTRIAL_CONTROL_SYSTEM
    method-module-name: INDUCTIVE_AUTOMATION_IGNITION_GATEWAY
    cpe: cpe:2.3:a:inductiveautomation:ignition:*:*:*:*:*:*:*:*
  tags: discovery,ics,ot,inductive-automation,ignition,gateway,scada
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/web/home"
      - "{{BaseURL}}/system/gwinfo"
      - "{{BaseURL}}/res/perspective/client.js"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      # Matcher 1: Title + Inductive Automation vendor marker.
      - type: word
        part: body
        words:
          - "<title>Ignition Gateway"
          - "Inductive Automation"
        condition: and
        case-insensitive: true
      # Matcher 2: gwinfo token triple.
      - type: word
        part: body
        words:
          - "ContextStatus="
          - "GatewayAddress="
          - "PlatformName=Ignition"
        condition: and
        case-insensitive: true
      # Matcher 3: Title + perspective client.js asset path — picks up
      # named-instance gateways where the title carries a site-name prefix
      # (e.g. "<site> - Ignition Gateway").
      - type: dsl
        dsl:
          - "contains(tolower(body), 'ignition gateway')"
          - "contains(body, '/res/perspective/client.js')"
        condition: and
      # Matcher 4: Title + Cache-Control: no-store — corroborating signal
      # for the gateway HTTP server.
      - type: dsl
        dsl:
          - "contains(tolower(body), '<title>ignition gateway')"
          - "contains(tolower(header), 'cache-control: no-store')"
        condition: and
