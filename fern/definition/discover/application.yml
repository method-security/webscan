imports:
  http: ../common/http.yml
types:
  # Application Enums
  ApplicationResourceTypeAll:
    enum:
      - ALL
  ApplicationResourceType:
    enum:
      - API_APPLICATION
      - CI_CD_PLATFORM
      - CLOUD_BUCKET
      - CONTENT_MANAGEMENT_SYSTEM
      - FIREWALL
      - HARDWARE_MANAGEMENT_SYSTEM
      - HYPERVISOR
      - KUBE
      - NETWORK_CONTROLLER
      - NETWORK_MANAGEMENT_SYSTEM
      - VDI_APPLICATION
      - WEB_SERVER
  ApplicationDetectionState:
    enum:
      - DEFAULT_PAGE
      - UNAUTHENTICATED
      - MISCONFIGURED
      - EXPOSED_ADMIN
      - VULNERABLE_VERSION
      - DEBUGGING_ENABLED
  ApplicationResourceConfigType:
    discriminated: false
    union:
      - ApplicationResourceType
      - ApplicationResourceTypeAll
  # Config Struct
  DiscoverApplicationConfig:
    properties:
      targets: list<string>
      resourceType: ApplicationResourceConfigType
      timeout: integer
      threads: integer
      proxy: optional<string>
      verboseLogs: boolean
      globalRateLimit: integer
  # Application Fingerprint Attempt Struct
  ApplicationFingerprintAttempt:
    properties:
      resourceType: ApplicationResourceType
      module: string
      detectionState: optional<ApplicationDetectionState>
      request: http.HttpRequestResponse
      finding: boolean
  ApplicationFingerprintTarget:
    properties:
      target: string
      attempts: list<ApplicationFingerprintAttempt>
  # Report Struct
  DiscoverApplicationResult:
    properties:
      targets: optional<list<ApplicationFingerprintTarget>>
  DiscoverApplicationReport:
    properties:
      config: DiscoverApplicationConfig
      result: DiscoverApplicationResult
      errors: optional<list<string>>
