id: aws-application-load-balancer-detect
info:
  name: AWS Application Load Balancer Detection
  author: method-security
  severity: info
  description: Detects AWS Application Load Balancer only when the response contains ALB-generated stickiness cookies.
  metadata:
    method-application-type: LOAD_BALANCER
    method-module-name: AWS_ALB
  tags: discovery,aws,alb,load-balancer
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)set-cookie:\\s*(?:AWSALB|AWSALBCORS|AWSALBTG|AWSALBTGCORS|AWSALBAPP-[0-9]+)="

