id: discover-aws-s3
info:
  name: AWS S3 Bucket Discovery
  author: method-security
  severity: info
  description: Detects AWS S3 bucket endpoints
  metadata:
    method-application-type: CLOUD_BUCKET # Added by method-security
    method-module-name: AWSS3 # Added by method-security
  tags: discovery,aws,s3,cloud,bucket
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "server: AmazonS3"
          - "x-amz-bucket-region"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "<Code>NoSuchBucket</Code>"
          - "<Code>AccessDenied</Code>"
          - "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
          - "Amazon S3"
          - "BucketAlreadyExists"
        case-insensitive: true


