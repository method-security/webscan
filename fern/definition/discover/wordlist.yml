imports:
  method: ../common/method.yml
types:
  DiscoverWordlistConfig:
    properties:
      target: string
      minWordLength: integer
      spiderDepth: integer
      includeMetadata: boolean
      includeComments: boolean
      includeAltText: boolean
      ignoreCrossDomain: boolean
      verifyTls: boolean
      timeout: integer
      threads: integer
      sleep: integer
      jitter: integer
      userAgent: method.UserAgentPreset
  WordlistEntry:
    properties:
      word: string
      count: integer
  DiscoverWordlistResult:
    properties:
      target: string
      words: optional<list<WordlistEntry>>
      totalUnique: optional<integer>
      urlsCrawled: optional<list<string>>
  DiscoverWordlistReport:
    properties:
      config: DiscoverWordlistConfig
      result: DiscoverWordlistResult
      errors: optional<list<string>>
