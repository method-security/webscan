id: asuswrt-router-web-ui-detect
info:
  name: ASUSWRT Router Management Console Detection
  author: method-security
  severity: info
  description: Detects ASUSWRT / ASUS Wireless Router web management interfaces using ASUS router-specific titles and login assets.
  metadata:
    method-application-type: ROUTER
    method-module-name: ASUSWRT_ROUTER
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:o:asus:asuswrt:*:*:*:*:*:*:*:*
  tags: discovery,asus,asuswrt,router,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Main_Login.asp"
      - "{{BaseURL}}/index.asp"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?i)<title>\s*ASUS\s+Wireless\s+Router'
          - '(?i)asus_token[\s\S]{0,500}Main_Login\.asp|Main_Login\.asp[\s\S]{0,500}asus_token'
          - '(?i)asuswrt[\s\S]{0,500}(asus_token|Main_Login\.asp)|(asus_token|Main_Login\.asp)[\s\S]{0,500}asuswrt'
