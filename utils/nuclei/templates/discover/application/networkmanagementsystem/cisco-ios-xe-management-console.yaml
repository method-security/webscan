id: cisco-ios-xe-web-ui-detect
info:
  name: Cisco IOS XE Management Console Detection
  author: method-security
  severity: info
  description: Detects Cisco IOS XE Web UI management consoles using IOS XE-specific login and webui markers.
  metadata:
    method-application-type: NETWORK_MANAGEMENT_SYSTEM
    method-module-name: CISCO_IOS_XE
    method-sub-module-name: MANAGEMENT_CONSOLE
    cpe: cpe:2.3:o:cisco:ios_xe:*:*:*:*:*:*:*:*
  tags: discovery,cisco,ios-xe,web-ui,network-management
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/webui/"
      - "{{BaseURL}}/webui/login"
      - "{{BaseURL}}/webui/login.html"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'contains(tolower(body), "cisco ios xe") && contains(tolower(body), "webui")'
          - 'contains(tolower(body), "cisco") && contains(tolower(body), "ios-xe") && contains(tolower(body), "web ui")'
          - 'contains(tolower(body), "cisco systems") && contains(tolower(body), "/webui/login/prop.js") && contains(tolower(body), "/webui/login/redirect.js")'
