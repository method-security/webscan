id: f5-bigip-apm-detect
info:
  name: F5 BIG-IP APM / Edge Gateway Detection
  author: method-security
  severity: info
  description: Detects F5 BIG-IP Access Policy Manager edge portals using my.policy and vdesk paths with F5/BIG-IP branded content.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: F5_BIGIP_APM
    cpe: cpe:2.3:a:f5:big-ip_access_policy_manager:*:*:*:*:*:*:*:*
  tags: discovery,f5,bigip,apm,vpn,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/my.policy"
      - "{{BaseURL}}/vdesk/hangup.php3"
      - "{{BaseURL}}/vdesk/webtop.eui"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "f5 networks"
          - "my.policy"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "f5 networks"
          - "vdesk"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "big-ip"
          - "access policy"
        condition: and
        case-insensitive: true
      - type: word
        part: all
        words:
          - "lastmrh_session"
          - "f5"
        condition: and
        case-insensitive: true
