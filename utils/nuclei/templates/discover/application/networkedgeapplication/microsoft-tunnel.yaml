id: microsoft-tunnel-detect
info:
  name: Microsoft Tunnel VPN Gateway Detection
  author: method-security
  severity: info
  description: Detects Microsoft Tunnel VPN gateways by matching the public liveness XML response and the AnyConnect-compatible WebVPN response headers exposed by the gateway.
  metadata:
    method-application-type: NETWORK_EDGE_APPLICATION
    method-module-name: MICROSOFT_TUNNEL
  tags: discovery,microsoft,intune,tunnel,ocserv,anyconnect,vpn,network-edge
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: header
        regex:
          - '(?i)set-cookie:\s*webvpncontext='
      - type: regex
        part: header
        regex:
          - '(?i)x-transcend-version:\s*1'
      - type: word
        part: body
        words:
          - '<message>I am still alive!!</message>'
