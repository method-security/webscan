id: oracle-cloud-console-detect
info:
  name: Oracle Cloud Console Detection
  author: method-security
  severity: info
  description: Detects Oracle Cloud Infrastructure console and sign-in surfaces using OCI-specific branding and identity markers.
  metadata:
    method-application-type: CLOUD_CONSOLE
    method-module-name: ORACLE_CLOUD_CONSOLE
    cpe: cpe:2.3:a:oracle:cloud_infrastructure_console:*:*:*:*:*:*:*:*
  tags: discovery,oracle,oci,cloud,console
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/signin"
      - "{{BaseURL}}/sign-in"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "oracle cloud") && contains(tolower(body), "cloud infrastructure") && contains(tolower(body), "sign in")'
          - 'status_code == 200 && contains(tolower(body), "oracleidentitycloudservice") && contains(tolower(body), "oracle cloud")'
          - 'status_code == 200 && contains(tolower(body), "cloud.oracle.com") && contains(tolower(body), "oracle cloud console")'
