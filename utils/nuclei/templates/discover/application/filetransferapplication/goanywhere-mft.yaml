id: goanywhere-mft-detect
info:
  name: Fortra GoAnywhere MFT Detection
  author: method-security
  severity: info
  description: Detects Fortra GoAnywhere MFT managed file transfer portals using branded login pages and GoAnywhere-specific web paths.
  metadata:
    method-application-type: FILE_TRANSFER_APPLICATION
    method-module-name: GOANYWHERE_MFT
    cpe: cpe:2.3:a:fortra:goanywhere_managed_file_transfer:*:*:*:*:*:*:*:*
  tags: discovery,fortra,goanywhere,mft,file-transfer
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/goanywhere/"
      - "{{BaseURL}}/goanywhere/lic/accept"
    redirects: true
    max-redirects: 5
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "goanywhere mft"
          - "login"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "goanywhere mft"
          - "sign in"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "goanywhere mft"
          - "web client"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "goanywhere"
          - "j_security_check"
        condition: and
        case-insensitive: true
      - type: word
        part: body
        words:
          - "goanywhere"
          - "license agreement"
          - "accept"
        condition: and
        case-insensitive: true
